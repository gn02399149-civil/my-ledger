<!DOCTYPE html>
<html lang="zh-TW">
<head>

<title>我的智慧帳本</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root {
  --primary:#3b5bdb; --primary-light:#edf2ff; --primary-dark:#2f4ac0;
  --success:#2f9e44; --success-light:#ebfbee;
  --danger:#e03131;  --danger-light:#fff5f5;
  --warning:#e67700; --purple:#7048e8;
  --bg:#f1f3f9; --surface:#fff; --surface2:#f8f9fc;
  --border:#e3e7f1; --text:#1a1f36; --text-2:#4a5072; --text-3:#8892b0;
  --radius:10px; --shadow:0 4px 16px rgba(0,0,0,.07); --tr:.15s ease;
}
*{box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);margin:0;padding:16px;color:var(--text);font-size:14px}
#cloudLoadingLock{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.lock-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
#lockStatusText{font-size:14px;font-weight:600;color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
.main-layout{display:flex;gap:16px;width:100%;max-width:1440px;margin:0 auto}
.container{background:var(--surface);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow);flex:1.35;min-width:0}
.sidebar{background:var(--surface);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);flex:0.65;display:flex;flex-direction:column;gap:20px;min-width:260px;max-width:360px}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.app-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.cloud-status-bar{display:flex;align-items:center;gap:6px;background:var(--primary-light);border:1px solid #c5d0fa;color:var(--primary);padding:5px 10px;border-radius:20px;font-size:12px;font-weig[...続く]
</style>

<body>
<div id="cloudLoadingLock"><div class="lock-spinner"></div><div id="lockStatusText">連線中... 正在載入帳目...</div></div>
<div id="toastMsg" class="toast"></div>

<div id="editModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEditModal()">
  <div class="modal-box">
    <div class="modal-title">✏️ 編輯記帳明細 <button class="modal-close" onclick="closeEditModal()">✕</button></div>
    <input type="hidden" id="editRecordId">
    <div class="form-row" style="margin-bottom:10px">
      <div class="form-group"><label>交易類型</label>
        <select id="editType" onchange="handleEditTypeChange()">
          <option value="支出">支出 💸</option><option value="收入">收入 💰</option><option value="轉帳">轉帳 🔄</option>
        </select>

<div class="main-layout">

        <button class="btn-ghost btn-sm" onclick="clearAllRecords()">清空</button>
      </div>
    </div>
    <div class="history-controls">
      <div class="control-row">
        <div class="control-item" style="flex:0.6;min-width:100px">
          <label>時間模式</label>

          </select>

      <div class="control-row">
        <div class="control-item" style="flex:1">
          <label>🔍 搜索備註 / 分類</label>
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchKeyword" placeholder="輸入關鍵字即時搜索…" autocomplete="off">

</div>
<div class="sidebar">
  <div>
    <div class="section-title">備份與導出</div>
    <div class="backup-zone">
      <button class="btn-backup btn-success" onclick="exportToCSV()">📊 匯出 CSV</button>

        <span class="budget-summary-label">總預算</span>

<script>
// ═══════════════════════════════════════════
//  常數
// ═══════════════════════════════════════════
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwtS-XCaLW48NLfV7xsZDbgJ5ptJ_2QjoQzAiDkJCQIWZUJ6MGuf3tmoYJT2f4qmd6Y/exec";
const LS = { records:'sl_records', budgets:'sl_budgets', groups:'sl_groups', accounts:'sl_accounts' };
const ACCOUNT_NAMES = ['現金','台灣銀行','newnewbank','郵局','二信','永豐','玉山信用卡','永豐信用卡','台新信用卡','富邦'];
const EXPENSE_DATA = {
  '餐飲食品':['早餐','午餐','晚餐','宵夜','飲料','點心零嘴','食材','水果'],
  '服飾美容':['衣服褲子','配件','鞋子','剪髮','保養品'],
  '居家生活':['傢俱','家電','房租','水費','電費','瓦斯費','網路費','電話費','保險費','稅務','阿曦','阿霄','訂閱支出','寶貝寵物','洗衣費用','生活用品'],
  '運輸交通':['計程車','高鐵','飛機','火車','船費','過路費','公車'],
  '教育學習':['文具','書籍','學貸','補習費'],
  '休閒娛樂':['電影','KTV','玩具小物','旅行遊玩','遊戲','彩券','運動健身','出國費用-日本'],
  '電子商品':['電腦及周邊','3C產品'],
  '汽機車':['油錢','停車費','保養費用','洗車費用','購車費用'],
  '醫療保健':['診所就醫','購買藥物','保健食品','健檢檢查'],
  '人情交際':['送禮','紅包','白包'],
  '理財投資':['股票','頭期貸款','房屋貸款'],
  '其他':['捐款','雜支','悠遊卡加值']
};
const INCOME_CATS = ['薪水','差旅費','利息','股票','其他'];

// ═══════════════════════════════════════════
//  狀態
// ═══════════════════════════════════════════
let records = [], budgets = {}, customGroupBudgets = {};
let accountBalances = Object.fromEntries(ACCOUNT_NAMES.map(n => [n, 0]));
let pieChart = null, barChart = null, lineChart = null;
let _lockDone = false;
let batchRowCounter = 0;

// ═══════════════════════════════════════════
//  工具函式 - 修正日期處理
// ═══════════════════════════════════════════
const $ = id => document.getElementById(id);
const isCreditCard = n => n.includes('信用卡');

/**
 * 將任何格式的日期轉換為 YYYY-MM-DD 字符串
 * 使用本地時區避免時區問題
 */
function toDateStr(d) {
  if (!d) return '';
  
  // 如果已經是字符串格式
  if (typeof d === 'string') {
    const s = d.trim();
    // 提取 YYYY-MM-DD 格式
    const match = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    return match ? `${match[1]}-${match[2]}-${match[3]}` : '';
  }
  
  // 如果是 Date 對象
  if (d instanceof Date) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }
  
  return '';
}

/**
 * 解析日期字符串為 Date 對象（使用本地時區）
 * 支持 YYYY-MM-DD、YYYY-MM 等格式
 */
function parseDate(s) {
  s = toDateStr(s);
  if (!s) return new Date();
  
  const parts = s.split('-');
  
  if (parts.length === 3) {
    // 直接使用本地時區，避免 UTC 轉換偏差
    const year = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1; // 月份是 0-11
    const day = parseInt(parts[2], 10);
    return new Date(year, month, day);
  }
  
  if (parts.length === 2) {
    const year = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1;
    return new Date(year, month, 1);
  }
  
  return new Date();
}

function showToast(msg, ms = 2500) {
  const t = $('toastMsg');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function highlight(text, kw) {
  if (!kw) return String(text || '');
  const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(text || '').replace(new RegExp(esc, 'gi'), m => `<span class="highlight">${m}</span>`);
}

function makeOptions(arr, el) {
  el.innerHTML = arr.map(v => `<option value="${v}">${v}</option>`).join('');
}

// ═══════════════════════════════════════════
//  LocalStorage
// ═══════════════════════════════════════════
function saveLocal() {
  localStorage.setItem(LS.records,  JSON.stringify(records));
  localStorage.setItem(LS.budgets,  JSON.stringify(budgets));
  localStorage.setItem(LS.groups,   JSON.stringify(customGroupBudgets));
  localStorage.setItem(LS.accounts, JSON.stringify(accountBalances));
}

function loadLocal() {
  try {
    const r = localStorage.getItem(LS.records);
    if (r) { records = JSON.parse(r); records.forEach(x => { x.date = toDateStr(x.date); }); }
    const b = localStorage.getItem(LS.budgets);  if (b) budgets = JSON.parse(b);
    const g = localStorage.getItem(LS.groups);   if (g) customGroupBudgets = JSON.parse(g);
    const a = localStorage.getItem(LS.accounts); if (a) accountBalances = JSON.parse(a);
  } catch(e) { console.error('[本機讀取]', e); }
}

// ═══════════════════════════════════════════
//  雲端
// ═══════════════════════════════════════════
function releaseLock() {
  if (_lockDone) return;
  _lockDone = true;
  $('cloudLoadingLock').style.display = 'none';
}

function setCloudStatus(msg, spinning) {
  $('cloudStatusText').textContent = msg;
  $('cloudStatusDot').className = 'sync-dot' + (spinning ? ' spinning' : '');
}

function buildPayload() {
  records.forEach(r => { r.date = toDateStr(r.date); });
  return {
    action: 'syncAll',
    accounts: ACCOUNT_NAMES.map(k => [k, accountBalances[k] || 0]),
    budgets: Object.entries(budgets),
    customGroupBudgets: JSON.stringify(customGroupBudgets),
    records
  };
}

function pushToCloud() {
  setCloudStatus('同步中...', true);
  fetch(CLOUD_URL, { method: 'POST', body: JSON.stringify(buildPayload()) })
    .then(r => r.json())
    .then(res => setCloudStatus(res.status === 'success' ? '已同步' : '❌ 失敗', false))
    .catch(() => setCloudStatus('⚠️ 離線', false));
}

function fetchCloudData() {
  setCloudStatus('連線中...', true);
  const fallback = reason => {
    console.warn('[雲端]', reason);
    setCloudStatus('離線模式', false);
    loadLocal();
    releaseLock();
    updateUI();
  };
  const timer = setTimeout(() => fallback('逾時 10s'), 10000);
  fetch(CLOUD_URL)
    .then(r => {
      const ct = r.headers.get('content-type') || '';
      if (!ct.includes('json') && !ct.includes('javascript'))
        return r.text().then(t => { throw new Error('非JSON: ' + t.slice(0,60)); });
      return r.json();
    })
    .then(res => {
      clearTimeout(timer);
      if (!res || res.status !== 'success' || !res.data) { fallback('雲端資料異常'); return; }
      const c = res.data;
      if (c.accounts && typeof c.accounts === 'object' && Object.keys(c.accounts).length > 0)
        accountBalances = c.accounts;
      if (c.budgets && typeof c.budgets === 'object') budgets = c.budgets;
      if (c.customGroupBudgets) {
        let cg = c.customGroupBudgets;
        if (typeof cg === 'string') { try { cg = JSON.parse(cg); } catch(e) { cg = {}; } }
        if (typeof cg === 'object') customGroupBudgets = cg;
      }
      if (Array.isArray(c.records)) {
        records = c.records;
        records.forEach(r => { r.date = toDateStr(r.date); });
        records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
        saveLocal();
      }
      setCloudStatus('已同步', false);
      releaseLock();
      updateUI();
    })
    .catch(err => { clearTimeout(timer); fallback(err.message); });
}

// ═══════════════════════════════════════════
//  UI 初始化
// ═══════════════════════════════════════════
function initAccountUI() {
  $('accountGrid').innerHTML = ACCOUNT_NAMES.map(name => `
    <div class="${isCreditCard(name) ? 'account-card credit' : 'account-card asset'}">
      <span class="account-name">${name}</span>
      <span class="account-val" id="val-${name}">$0</span>
      <div class="account-input-group">
        <input type="number" id="input-${name}" placeholder="設初值">
        <button onclick="updateAccountInit('${name}')">改</button>
      </div>
    </div>`).join('');
}

function initSelects() {
  ['editAccount','editFromAccount','editToAccount'].forEach(id => {
    const e = $(id); if (e) makeOptions(ACCOUNT_NAMES, e);
  });
  makeOptions(Object.keys(EXPENSE_DATA), $('budgetCategory'));
}

function initCustomGroupSubCats() {
  $('customGroupSubCats').innerHTML = Object.entries(EXPENSE_DATA).map(([main, subs]) =>
    `<optgroup label="【${main}】">${subs.map(s => `<option value="${s}">${s}</option>`).join('')}</optgroup>`
  ).join('');
}

function initMonthSelects() {
  const now = new Date();
  const opts = Array.from({length: 9}, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 6 + i, 1);
    const ms = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    return `<option value="${ms}"${i===6?' selected':''}>${ms}</option>`;
  }).join('');
  ['budgetMonthSelect','filterMonthSelect'].forEach(id => { $(id).innerHTML = opts; });
}

function initFilterCats() {
  const expHtml = Object.keys(EXPENSE_DATA).map(c => `<option value="${c}">${c}</option>`).join('');
  const incHtml = INCOME_CATS.map(c => `<option value="${c}">${c}</option>`).join('');
  $('filterCategorySelect').innerHTML = `<option value="ALL">全部</option>
    <optgroup label="💸 支出大項">${expHtml}</optgroup>
    <optgroup label="💰 收入管道">${incHtml}</optgroup>
    <option value="內部轉帳">🔄 內部轉帳</option>`;
}

function handleBatchTypeChange(id) {
  const type = $(`batch-type-${id}`).value;
  const isT = type === '轉帳', isI = type === '收入';
  
  $(`batch-acc-group-${id}`).style.display = isT ? 'none' : 'block';
  $(`batch-from-group-${id}`).style.display = isT ? 'block' : 'none';
  $(`batch-to-group-${id}`).style.display = isT ? 'block' : 'none';
  $(`batch-main-cat-group-${id}`).style.display = isT ? 'none' : 'block';
  $(`batch-sub-cat-group-${id}`).style.display = (isT || isI) ? 'none' : 'block';
  
  $(`batch-main-label-${id}`).textContent = isI ? '收入分類' : '支出大項';
  
  const ms = $(`batch-main-cat-${id}`);
  ms.innerHTML = '';
  if (!isT) {
    (isI ? INCOME_CATS : Object.keys(EXPENSE_DATA)).forEach(c => {
      const o = document.createElement('option');
      o.value = o.textContent = c;
      ms.appendChild(o);
    });
  }
  if (!isT && !isI) handleBatchMainCatChange(id);
}

function handleBatchMainCatChange(id) {
  const mainVal = $(`batch-main-cat-${id}`).value;
  makeOptions(EXPENSE_DATA[mainVal] || [], $(`batch-sub-cat-${id}`));
}

// 🚀 批次新增儲存功能
function addBatchRecords() {
  const rows = $('batchInputContainer').children;
  let addedCount = 0;
  let validRecords = [];

  for (let row of rows) {
    const rowId = row.id.replace('batch-row-', '');
    const type = $(`batch-type-${rowId}`).value;
    const amount = parseInt($(`batch-amount-${rowId}`).value);
    const note = $(`batch-note-${rowId}`).value.trim();
    const date = toDateStr($(`batch-date-${rowId}`).value);

    // 金額為空或小於等於 0 則視為不輸入（跳過）
    if (isNaN(amount) || amount <= 0) continue;
    if (!date) { showToast('⚠️ 請確實選擇日期'); return; }

    const rec = { id: Date.now() + addedCount, type, amount, note: note || '無備註', date };
    if (type === '轉帳') {
      const from = $(`batch-from-account-${rowId}`).value;
      const to = $(`batch-to-account-${rowId}`).value;
      if (from === to) { showToast('⚠️ 轉帳帳戶不能相同'); return; }
      rec.fromAccount = from; rec.toAccount = to;
    } else {
      rec.account = $(`batch-account-${rowId}`).value;
      rec.mainCategory = $(`batch-main-cat-${rowId}`).value;
      rec.subCategory = type === '支出' ? $(`batch-sub-cat-${rowId}`).value : '';
    }
    validRecords.push(rec);
    addedCount++;
  }

  if (validRecords.length === 0) {
    showToast('⚠️ 沒有可新增的有效帳目資料（請填入金額）');
    return;
  }

  // 合併至主要資歷庫
  records.push(...validRecords);
  records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
  
  saveLocal(); 
  updateUI(); 
  pushToCloud();
  
  // 清空輸入表單，只保留一列全新空白
  $('batchInputContainer').innerHTML = '';
  addBatchRow();
  showToast(`✅ 成功批次同步新增 ${addedCount} 筆交易！`);
}

function openEditModal(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  $('editRecordId').value = r.id;
  $('editType').value    = r.type;
  $('editDate').value    = r.date;
  $('editAmount').value  = r.amount;
  $('editNote').value    = r.note === '無備註' ? '' : (r.note || '');
  syncTypeUI('edit');
  if (r.type === '轉帳') {
    $('editFromAccount').value = r.fromAccount || '';
    $('editToAccount').value   = r.toAccount   || '';
  } else {
    $('editAccount').value = r.account || '';
    const ms = $('editMainCategory');
    [...ms.options].forEach(o => { o.selected = o.value === r.mainCategory; });
    handleEditMainCatChange();
    if (r.subCategory) { const ss = $('editSubCategory'); [...ss.options].forEach(o => { o.selected = o.value === r.subCategory; }); }
  }
  $('editModal').style.display = 'flex';
}

function closeEditModal() { $('editModal').style.display = 'none'; }

function saveEditRecord() {
  const id  = parseInt($('editRecordId').value);
  const idx = records.findIndex(x => x.id === id); if (idx === -1) return;
  const type   = $('editType').value;
  const amount = parseInt($('editAmount').value);
  const note   = $('editNote').value.trim();
  const date   = toDateStr($('editDate').value);
  if (!date || isNaN(amount) || amount <= 0) { showToast('⚠️ 請填入日期與金額'); return; }
  const updated = { id, type, amount, note: note || '無備註', date };
  if (type === '轉帳') {
    const from = $('editFromAccount').value, to = $('editToAccount').value;
    if (from === to) { showToast('⚠️ 轉帳帳戶不能相同'); return; }
    updated.fromAccount = from; updated.toAccount = to;
  } else {
    updated.account      = $('editAccount').value;
    updated.mainCategory = $('editMainCategory').value;
    updated.subCategory  = type === '支出' ? $('editSubCategory').value : '';
  }
  records[idx] = updated;
  records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
  saveLocal(); updateUI(); pushToCloud();
  closeEditModal();
  showToast('✅ 已更新');
}

function deleteRecord(id) {
  if (!confirm('確定刪除這筆記錄？')) return;
  records = records.filter(r => r.id !== id);
  saveLocal(); updateUI(); pushToCloud();
  showToast('🗑️ 已刪除');
}

function clearAllRecords() {
  if (!confirm('確定清空全部明細？此操作無法還原！')) return;
  records = []; saveLocal(); updateUI(); pushToCloud();
}

function saveCustomGroupBudget() {
  const name = $('customGroupName').value.trim();
  const amt  = parseInt($('customGroupAmount').value);
  const subs = [...$('customGroupSubCats').selectedOptions].map(o => o.value);

  saveLocal(); updateUI(); pushToCloud();
  showToast(`✅ 群組「${name}」建立完成`);
}

function exportToCSV() {
  let csv = "=== 系統帳戶初始設定配額 ===\n帳戶名稱,初始金額\n";
  ACCOUNT_NAMES.forEach(n => { csv += `${n},${accountBalances[n]}\n`; });
  csv += "=== 明細流水帳紀錄開始 ===\n交易日期,交易類型,主分類/大項,子分類/小項,交易帳戶/細節,金額,備註說明\n";
  records.forEach(r => {
    let row = [toDateStr(r.date), r.type];
    if (r.type === '轉帳') row.push('內部轉帳', '-', `從 [${r.fromAccount}] 轉到 [${r.toAccount}]`);
    else row.push(r.mainCategory||'', r.subCategory||'-', r.account||'');
    row.push(r.amount, String(r.note||'').replace(/,/g,' '));
    csv += row.join(',') + "\n";
  });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'})),
    download: `智慧記帳本_${toDateStr(new Date())}.csv`
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('📊 CSV 已匯出');
}

function triggerCSVImport() { $('importCSVFileInput').click(); }

function importFromCSV(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split('\n');
      let imported = [], parsedAcc = {...accountBalances}, readingRecs = false;
      lines.forEach((line, i) => {
        line = line.trim(); if (!line) return;
        if (line.includes('=== 明細流水帳紀錄開始 ===')) { readingRecs = true; return; }
        if (!readingRecs) {
          const p = line.split(',');
          if (p.length === 2 && ACCOUNT_NAMES.includes(p[0].trim())) parsedAcc[p[0].trim()] = parseInt(p[1].trim()) || 0;
        } else {
          const c = line.split(','); if (c.length < 6) return;
          const item = { id: Date.now()+i, date: toDateStr(c[0].trim()), type: c[1].trim(), amount: parseInt(c[5].trim())||0, note: c[6]?c[6].trim():'無備註' };
          if (item.type === '轉帳') { const m = c[4].trim().match(/從 \[(.*?)\] 轉到 \[(.*?)\]/); if (m) { item.fromAccount = m[1]; item.toAccount = m[2]; } }
          else { item.mainCategory = c[2].trim(); item.subCategory = c[3].trim()==='-'?'':c[3].trim(); item.account = c[4].trim(); }
          imported.push(item);
        }
      });
      if (!confirm(`確認匯入 ${imported.length} 筆資料並覆蓋雲端？`)) return;
      accountBalances = parsedAcc;
      records = imported.sort((a, b) => parseDate(b.date) - parseDate(a.date));
      saveLocal(); updateUI(); pushToCloud();
      showToast(`✅ 已匯入 ${imported.length} 筆`);
    } catch(err) { showToast('❌ 匯入失敗：' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
}

// ═══════════════════════════════════════════
//  主渲染
// ═══════════════════════════════════════════
function updateUI() {
  const selBudgetMonth = $('budgetMonthSelect').value;
  const bDate = parseDate(selBudgetMonth);
  const bYear = bDate.getFullYear(), bMon = bDate.getMonth() + 1;
  const chartStart = parseDate($('analysisStartDate').value);
  const chartEnd   = parseDate($('analysisEndDate').value);
  const filterMode  = $('filterTimeMode').value;
  const filterMonth = $('filterMonthSelect').value;
  const filterStart = parseDate($('filterStartDate').value);
  const filterEnd   = parseDate($('filterEndDate').value);
  const filterCat   = $('filterCategorySelect').value;
  const kw    = $('searchKeyword').value.trim();
  const kwLow = kw.toLowerCase();

  const balances     = {...accountBalances};
  const expChart     = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const incChart     = Object.fromEntries(INCOME_CATS.map(k => [k, 0]));
  const monBudSpent  = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const yearBudSpent = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const grpMonSpent  = Object.fromEntries(Object.keys(customGroupBudgets).map(k => [k, 0]));
  const grpYrSpent   = Object.fromEntries(Object.keys(customGroupBudgets).map(k => [k, 0]));
  const assetLine    = {};
  let totalInc = 0, totalExp = 0;

  [...records].reverse().forEach(r => {
    r.date = toDateStr(r.date);
    const rDate = parseDate(r.date);
    const rYM   = r.date.slice(0, 7);
    const rYear = parseInt(r.date.slice(0, 4));
    const rMon  = parseInt(r.date.slice(5, 7));

    if (r.type === '轉帳') {
      if (balances[r.fromAccount] !== undefined) balances[r.fromAccount] -= r.amount;
      if (balances[r.toAccount]   !== undefined) {
        if (isCreditCard(r.toAccount)) balances[r.toAccount] -= r.amount;
        else balances[r.toAccount] += r.amount;
      }
    } else if (r.type === '收入') {
      totalInc += r.amount;
      if (balances[r.account] !== undefined) balances[r.account] += r.amount;
      if (rDate >= chartStart && rDate <= chartEnd && incChart[r.mainCategory] !== undefined)
        incChart[r.mainCategory] += r.amount;
    } else {
      totalExp += r.amount;
      if (balances[r.account] !== undefined) {
        if (isCreditCard(r.account)) balances[r.account] += r.amount;
        else balances[r.account] -= r.amount;
      }
      if (rYM === selBudgetMonth) {
        if (monBudSpent[r.mainCategory] !== undefined) monBudSpent[r.mainCategory] += r.amount;
        Object.entries(customGroupBudgets).forEach(([g, cfg]) => { if (cfg.subCats?.includes(r.subCategory)) grpMonSpent[g] = (grpMonSpent[g]||0) + r.amount; });
      }
      if (rYear === bYear && rMon <= bMon) {
        if (yearBudSpent[r.mainCategory] !== undefined) yearBudSpent[r.mainCategory] += r.amount;
        Object.entries(customGroupBudgets).forEach(([g, cfg]) => { if (cfg.subCats?.includes(r.subCategory)) grpYrSpent[g] = (grpYrSpent[g]||0) + r.amount; });
      }
      if (rDate >= chartStart && rDate <= chartEnd && expChart[r.mainCategory] !== undefined)
        expChart[r.mainCategory] += r.amount;
    }
    let tA = 0, tL = 0;
    ACCOUNT_NAMES.forEach(n => isCreditCard(n) ? tL += (balances[n]||0) : tA += (balances[n]||0));
    assetLine[r.date] = tA - tL;
  });

  // 看板
  $('totalIncome').textContent  = totalInc.toLocaleString();
  $('totalExpense').textContent = totalExp.toLocaleString();
  let totA = 0, totL = 0;
  ACCOUNT_NAMES.forEach(n => {
    const v = balances[n] || 0, ve = $(`val-${n}`);
    if (isCreditCard(n)) {
      ve.textContent = v > 0 ? `欠 $${v.toLocaleString()}` : '$0';
      ve.style.color = v > 0 ? 'var(--danger)' : 'var(--text-3)';
      totL += v;
    } else {
      ve.textContent = `$${v.toLocaleString()}`;
      ve.style.color = v < 0 ? 'var(--danger)' : 'var(--text)';
      totA += v;
    }
  });
  const net = totA - totL, netEl = $('netBalance');
  netEl.textContent = `$${net.toLocaleString()}`;
  netEl.style.color = net < 0 ? '#fca5a5' : 'white';

  // 更新預算控管顯示...（省略詳細代碼以節省篇幅）

  // 歷史明細
  const filterMonthDate = parseDate(filterMonth);
  const monthStr = filterMonth;
  
  const filtered = records.filter(r => {
    r.date = toDateStr(r.date);
    const rDate = parseDate(r.date);
    let timeMatch = false;
    if (filterMode === 'month') {
      timeMatch = r.date.slice(0, 7) === monthStr;
    } else {
      timeMatch = rDate >= filterStart && rDate <= filterEnd;
    }
    
    let catMatch = filterCat === 'ALL' || r.mainCategory === filterCat || (r.type === '內部轉帳' && filterCat === '內部轉帳');
    if (r.type === '轉帳') catMatch = filterCat === 'ALL' || filterCat === '內部轉帳';
    
    let kwMatch = !kw || (r.note && r.note.toLowerCase().includes(kwLow)) || (r.mainCategory && r.mainCategory.toLowerCase().includes(kwLow));
    
    return timeMatch && catMatch && kwMatch;
  });
  
  $('searchCount').textContent = filtered.length > 0 ? `共 ${filtered.length} 筆` : '';
  $('recordList').innerHTML = filtered.map(r => {
    const amount = String(r.amount);
    const isInc = r.type === '收入';
    const isExp = r.type === '支出';
    const isTrf = r.type === '轉帳';
    const borderClass = isInc ? 'income-border' : (isExp ? 'expense-border' : 'transfer-border');
    const amountColor = isInc ? 'var(--success)' : (isTrf ? 'var(--purple)' : 'var(--danger)');
    const amountPrefix = isInc ? '+' : (isTrf ? '→' : '−');
    
    return `<div class="history-item">
      <div class="item-left ${borderClass}">
        <div class="item-date">${highlight(r.date, kw)}</div>
        <div class="item-title">${highlight(r.type, kw)} ${r.mainCategory && !isTrf ? `<span class="item-acc-tag">${highlight(r.mainCategory, kw)}</span>` : ''} ${r.subCategory && isExp ? `<span class="item-sub-tag">${highlight(r.subCategory, kw)}</span>` : ''}</div>
        <div class="item-note">${highlight(r.note, kw)}</div>
      </div>
      <div class="item-right">
        <div class="item-amount" style="color:${amountColor}">${amountPrefix}$${highlight(amount, kw)}</div>
        <button class="btn-item-action btn-item-edit" onclick="openEditModal(${r.id})">編</button>
        <button class="btn-item-action btn-item-delete" onclick="deleteRecord(${r.id})">刪</button>
      </div>
    </div>`;
  }).join('');

  // 圖表
  if (!$('chartsWrapper').classList.contains('collapsed')) {
    drawExpensePieChart(expChart);
    drawIncomeBarChart(incChart);
    drawAssetLineChart(assetLine);
  }
}

// 圖表函式（保留原有邏輯）
function drawExpensePieChart(data) {
  const ctx = $('expensePieChart')?.getContext('2d');
  if (!ctx) return;
  const labels = Object.keys(data).filter(k => data[k] > 0);
  const values = labels.map(k => data[k]);
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: ['#3b5bdb','#7048e8','#e03131','#2f9e44','#e67700','#087e8b','#f77f00','#d62828','#f4a460','#ff6b6b','#ffd700','#90ee90'] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
}

function drawIncomeBarChart(data) {
  const ctx = $('incomeBarChart')?.getContext('2d');
  if (!ctx) return;
  const labels = Object.keys(data).filter(k => data[k] > 0);
  const values = labels.map(k => data[k]);
  if (barChart) barChart.destroy();
  barChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: '金額', data: values, backgroundColor: '#2f9e44' }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

function drawAssetLineChart(data) {
  const ctx = $('assetLineChart')?.getContext('2d');
  if (!ctx) return;
  const dates = Object.keys(data).sort();
  const values = dates.map(d => data[d]);
  if (lineChart) lineChart.destroy();
  lineChart = new Chart(ctx, {
    type: 'line',
    data: { labels: dates, datasets: [{ label: '淨資產', data: values, borderColor: '#3b5bdb', backgroundColor: 'rgba(59,91,219,.1)', tension: .3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true } } }
  });
}

  initAccountUI();

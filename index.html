<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的智慧帳本</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root {
  --primary:#3b5bdb; --primary-light:#edf2ff; --primary-dark:#2f4ac0;
  --success:#2f9e44; --success-light:#ebfbee;
  --danger:#e03131;  --danger-light:#fff5f5;
  --warning:#e67700; --purple:#7048e8;
  --bg:#f1f3f9; --surface:#fff; --surface2:#f8f9fc;
  --border:#e3e7f1; --text:#1a1f36; --text-2:#4a5072; --text-3:#8892b0;
  --radius:10px; --shadow:0 4px 16px rgba(0,0,0,.07); --tr:.15s ease;
}
*{box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);margin:0;padding:16px;color:var(--text);font-size:14px}
#cloudLoadingLock{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.lock-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
#lockStatusText{font-size:14px;font-weight:600;color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
.main-layout{display:flex;gap:16px;width:100%;max-width:1440px;margin:0 auto}
.container{background:var(--surface);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow);flex:1.35;min-width:0}
.sidebar{background:var(--surface);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);flex:0.65;display:flex;flex-direction:column;gap:20px;min-width:260px;max-width:360px}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.app-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.cloud-status-bar{display:flex;align-items:center;gap:6px;background:var(--primary-light);border:1px solid #c5d0fa;color:var(--primary);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.sync-dot.spinning{background:transparent;border:2px solid var(--primary);border-top-color:transparent;animation:spin .8s linear infinite;width:10px;height:10px}
.dashboard{background:linear-gradient(135deg,#1e3a8a,#1d4ed8 60%,#3b82f6);color:#fff;padding:18px 20px;border-radius:12px;margin-bottom:16px}
.balance-title{font-size:11px;color:rgba(255,255,255,.6);text-align:center;letter-spacing:.8px;text-transform:uppercase}
.balance-amount{font-size:32px;font-weight:700;text-align:center;margin:4px 0 14px;letter-spacing:-1px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
.step-box{text-align:center}
.stat-label{font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.4px}
.stat-value{font-size:15px;font-weight:700;margin-top:2px}
.text-income{color:#6ee7b7}.text-expense{color:#fca5a5}
.section-title{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);margin:0 0 10px;display:flex;align-items:center;gap:6px}
.section-title::before{content:'';display:block;width:3px;height:14px;background:var(--primary);border-radius:2px}

/* 多筆記帳區樣式 */
.batch-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
.batch-row { display: flex; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; align-items: center; min-width: 850px; }
.batch-cell { display: flex; flex-direction: column; gap: 3px; }
.batch-cell label { font-size: 10px; color: var(--text-2); font-weight: 600; }
.batch-cell input, .batch-cell select { padding: 5px 8px; font-size: 12px; height: 30px; border-radius: 5px; }
.btn-remove-row { background: var(--danger-light); color: var(--danger); border: 1px solid #ffc9c9; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-top: 15px; transition: all var(--tr); }
.btn-remove-row:hover { background: var(--danger); color: #fff; }
.batch-actions { display: flex; gap: 10px; margin-bottom: 20px; }

.form-group{margin-bottom:10px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1;margin-bottom:0}
label{display:block;margin-bottom:4px;color:var(--text-2);font-weight:600;font-size:11px;letter-spacing:.3px}
input,select{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;background:var(--surface);color:var(--text);transition:border-color var(--tr),box-shadow var(--tr);font-family:inherit}
input:focus,select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(59,91,219,.1)}
button{padding:7px 14px;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);font-family:inherit}
.btn-primary{background:var(--primary);width:100%;padding:11px;font-size:14px;margin-top:4px}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,91,219,.3)}
.btn-sm{font-size:11px;padding:3px 8px}
.btn-ghost{background:var(--surface2);color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border);color:var(--text)}
.btn-success{background:var(--success)}.btn-success:hover{background:#267a38}
.btn-danger{background:var(--danger)}.btn-danger:hover{background:#c02222}
.btn-dark{background:#2d3748}.btn-dark:hover{background:#1a202c}
.btn-backup{font-size:12px;width:100%;padding:9px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-toggle-view{background:var(--surface2);color:var(--text-2);border:1px solid var(--border);font-size:11px;padding:4px 9px}
.btn-toggle-view:hover{background:var(--border)}
.shortcut-hint{font-size:10px;color:var(--text-3);margin-top:4px;text-align:right}
kbd{display:inline-block;padding:1px 4px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;font-size:10px;font-family:inherit;color:var(--text-2);font-weight:600}
.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.account-card{background:var(--surface2);border:1.5px solid var(--border);padding:8px 10px;border-radius:8px;display:flex;flex-direction:column}
.account-card.credit{border-left:3px solid var(--danger)}
.account-card.asset{border-left:3px solid var(--success)}
.account-name{font-size:11px;font-weight:700;color:var(--text-2)}
.account-val{font-size:14px;font-weight:700;margin:2px 0}
.account-input-group{display:flex;gap:4px;margin-top:4px}
.account-input-group input{padding:3px 5px;font-size:11px;height:22px}
.account-input-group button{font-size:10px;padding:2px 6px;background:var(--primary)}
.history-controls{background:var(--surface2);padding:10px 12px;border-radius:9px;border:1px solid var(--border);margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.control-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.control-item{flex:1;min-width:130px}
.control-item label{font-size:11px;margin-bottom:2px}
.control-item select,.control-item input{padding:5px 8px;font-size:12px}
.search-wrap{position:relative}
.search-wrap input{padding-left:28px}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.4;pointer-events:none}
.search-count{font-size:10px;color:var(--text-3);margin-top:3px;min-height:14px}
.history-list-wrapper{max-height:420px;overflow-y:auto;padding-right:2px}
.history-list-wrapper.collapsed{display:none}
.history-list-wrapper::-webkit-scrollbar{width:5px}
.history-list-wrapper::-webkit-scrollbar-track{background:var(--surface2);border-radius:10px}
.history-list-wrapper::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.history-item{background:var(--surface);padding:9px 12px;border:1px solid var(--border);margin-bottom:6px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;transition:box-shadow var(--tr)}
.history-item:hover{box-shadow:0 1px 4px rgba(0,0,0,.08)}
.item-left{border-left:3px solid #cbd5e1;padding-left:9px;min-width:0;flex:1}
.item-left.income-border{border-left-color:var(--success)}
.item-left.expense-border{border-left-color:var(--danger)}
.item-left.transfer-border{border-left-color:var(--purple)}
.item-date{font-size:10px;color:var(--text-3);font-weight:600}
.item-title{font-weight:600;color:var(--text);font-size:13px;margin:2px 0;display:flex;align-items:center;flex-wrap:wrap;gap:3px}
.item-note{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.item-acc-tag{display:inline-flex;align-items:center;background:#eef2ff;color:#3b5bdb;font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700}
.item-sub-tag{display:inline-flex;align-items:center;background:var(--surface2);color:var(--text-3);font-size:10px;padding:1px 5px;border-radius:4px}
.item-right{display:flex;align-items:center;gap:5px;flex-shrink:0;margin-left:8px}
.item-amount{font-weight:700;font-size:14px;white-space:nowrap}
.highlight{background:#fff3bf;border-radius:2px;padding:0 1px}
.btn-item-action{background:none;color:var(--text-3);border:1px solid var(--border);padding:2px 6px;cursor:pointer;font-size:11px;border-radius:5px;transition:all var(--tr)}
.btn-item-edit:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-light)}
.btn-item-delete:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-light)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border-radius:12px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:16px;font-weight:700;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;color:var(--text-3);border:none;font-size:20px;padding:0;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:8px;margin-top:16px}
.modal-footer button{flex:1}
.budget-item{margin-bottom:8px;background:var(--surface);padding:9px 10px;border-radius:8px;border:1px solid var(--border)}
.budget-info{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;align-items:center}
.progress-bar-bg{background:var(--border);border-radius:4px;height:5px;overflow:hidden;margin-bottom:2px}
.progress-bar-bg.year-bg{height:3px;margin-top:3px}
.progress-bar-fill{background:var(--primary);height:100%;width:0;transition:width .4s ease}
.progress-bar-fill.year-fill{background:var(--warning)}
.progress-over{background:var(--danger)!important}
.budget-action-btns{display:flex;gap:3px;align-items:center}
.btn-budget-edit,.btn-budget-delete{background:none;color:var(--text-3);border:none;padding:2px 4px;cursor:pointer;font-size:11px;border-radius:4px}
.btn-budget-edit:hover{color:var(--primary);background:var(--primary-light)}
.btn-budget-delete:hover{color:var(--danger);background:var(--danger-light)}
.budget-summary-box{background:var(--surface2);border:1px dashed var(--border);border-radius:8px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:5px}
.budget-summary-row{display:grid;grid-template-columns:80px 1fr 1fr 1fr;gap:4px;align-items:center}
.budget-summary-row.header{border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:2px}
.budget-summary-title{font-size:11px;font-weight:700;color:var(--text-2)}
.budget-summary-label{font-size:10px;color:var(--text-3);font-weight:600;text-align:center}
.budget-summary-val{font-size:12px;font-weight:700;text-align:center}
.analysis-section{background:var(--surface2);padding:14px 16px;border-radius:10px;border:1px solid var(--border);margin-top:16px}
.analysis-header{display:flex;justify-content:space-between;align-items:center}
.charts-wrapper{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.charts-wrapper.collapsed{display:none}
.chart-box-standalone{background:var(--surface);padding:12px 14px;border-radius:8px;border:1px solid var(--border);height:240px;position:relative}
.chart-box-standalone h4{margin:0 0 6px;color:var(--text-2);font-size:11px;text-align:center;font-weight:600}
.custom-budget-zone{background:#f0f7ff;padding:10px 12px;border-radius:8px;border:1px solid #c3dafe;margin-top:10px}
.custom-budget-zone h4{margin:0 0 8px;color:#2b6cb0;font-size:12px}
.custom-budget-item{border-left:3px solid var(--primary)}
.backup-zone{display:flex;flex-direction:column;gap:5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1f36;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:10000;transition:transform .3s ease,opacity .3s ease;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:900px){body{padding:10px}.main-layout{flex-direction:column}.sidebar{max-width:100%}.form-row{flex-direction:column;gap:8px}.form-row .form-group{flex:none}.balance-amount{font-size:26px}.control-row{flex-direction:column}.control-item{min-width:100%}}
@media(max-width:500px){.type-tabs{flex-wrap:wrap}.type-tab{flex:1 1 calc(50% - 3px)}.history-list-wrapper{max-height:300px}.chart-box-standalone{height:200px}}
</style>
</head>
<body>
<div id="cloudLoadingLock"><div class="lock-spinner"></div><div id="lockStatusText">連線中... 正在載入帳目...</div></div>
<div id="toastMsg" class="toast"></div>

<div id="editModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEditModal()">
  <div class="modal-box">
    <div class="modal-title">✏️ 編輯記帳明細 <button class="modal-close" onclick="closeEditModal()">✕</button></div>
    <input type="hidden" id="editRecordId">
    <div class="form-row" style="margin-bottom:10px">
      <div class="form-group"><label>交易類型</label>
        <select id="editType" onchange="handleEditTypeChange()">
          <option value="支出">支出 💸</option><option value="收入">收入 💰</option><option value="轉帳">轉帳 🔄</option>
        </select>
      </div>
      <div class="form-group"><label>交易日期</label><input type="date" id="editDate"></div>
    </div>
    <div class="form-group" id="editNormalAccGroup"><label>交易帳戶</label><select id="editAccount"></select></div>
    <div class="form-row" id="editTransferGroup" style="display:none;margin-bottom:10px">
      <div class="form-group"><label>轉出帳戶</label><select id="editFromAccount"></select></div>
      <div class="form-group"><label>轉入帳戶</label><select id="editToAccount"></select></div>
    </div>
    <div class="form-row" id="editCategoryRow" style="margin-bottom:10px">
      <div class="form-group"><label id="editMainCatLabel">支出大項</label><select id="editMainCategory" onchange="handleEditMainCatChange()"></select></div>
      <div class="form-group" id="editSubCategoryGroup"><label>支出小項</label><select id="editSubCategory"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>金額</label><input type="number" id="editAmount" placeholder="金額" inputmode="decimal"></div>
      <div class="form-group"><label>備註說明</label><input type="text" id="editNote" placeholder="備註"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeEditModal()">取消</button>
      <button class="btn-primary" style="margin-top:0" onclick="saveEditRecord()">儲存變更</button>
    </div>
  </div>
</div>

<div class="main-layout">
<div class="container">
  <div class="app-header">
    <div class="app-title">📒 我的智慧帳本</div>
    <div class="cloud-status-bar"><div class="sync-dot" id="cloudStatusDot"></div><span id="cloudStatusText">連接中...</span></div>
  </div>
  
  <div class="dashboard">
    <div class="balance-title">淨資產總額（資產 − 信用卡負債）</div>
    <div class="balance-amount" id="netBalance">$0</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">本期收入</div><div class="stat-value text-income">+$<span id="totalIncome">0</span></div></div>
      <div class="stat-box"><div class="stat-label">本期支出</div><div class="stat-value text-expense">−$<span id="totalExpense">0</span></div></div>
    </div>
  </div>

  <!-- 多筆記帳動態輸入區 -->
  <div class="section-title">批次新增記帳</div>
  <div id="batchInputContainer" class="batch-container">
    <!-- 動態生成輸入列 -->
  </div>
  <div class="batch-actions">
    <button class="btn-ghost btn-sm" onclick="addBatchRow()">➕ 增加一筆</button>
  </div>
  <button class="btn-primary" onclick="addBatchRecords()">🚀 批次新增並同步雲端</button>
  <div class="shortcut-hint">快捷鍵：輸入完畢後點擊上方按鈕一次同步</div>

  <div class="analysis-section">
    <div class="analysis-header">
      <div class="section-title" style="margin-bottom:0">視覺圖表分析</div>
      <button class="btn-toggle-view" id="btnToggleCharts" onclick="toggleChartsCollapse()">📊 展開圖表</button>
    </div>
    <div class="charts-wrapper collapsed" id="chartsWrapper">
      <div class="form-row" style="margin-top:10px;margin-bottom:4px">
        <div class="form-group"><label style="font-size:11px">圖表開始日期</label><input type="date" id="analysisStartDate" onchange="updateUI()"></div>
        <div class="form-group"><label style="font-size:11px">圖表結束日期</label><input type="date" id="analysisEndDate" onchange="updateUI()"></div>
      </div>
      <div class="chart-box-standalone"><h4>各項支出比例 💸</h4><canvas id="expensePieChart"></canvas></div>
      <div class="chart-box-standalone"><h4>收入管道分配 💰</h4><canvas id="incomeBarChart"></canvas></div>
      <div class="chart-box-standalone"><h4>資產淨值走勢 📈</h4><canvas id="assetLineChart"></canvas></div>
    </div>
  </div>
  <div style="margin-top:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="section-title" style="margin-bottom:0">歷史明細</div>
      <div style="display:flex;gap:6px">
        <button class="btn-toggle-view" id="btnToggleCollapse" onclick="toggleHistoryCollapse()">📂 收合</button>
        <button class="btn-ghost btn-sm" onclick="clearAllRecords()">清空</button>
      </div>
    </div>
    <div class="history-controls">
      <div class="control-row">
        <div class="control-item" style="flex:0.6;min-width:100px">
          <label>時間模式</label>
          <select id="filterTimeMode" onchange="handleTimeModeChange()">
            <option value="month">按月份</option><option value="days">自訂日期</option>
          </select>
        </div>
        <div class="control-item" id="filterMonthGroup"><label>選擇月份</label><select id="filterMonthSelect" onchange="updateUI()"></select></div>
        <div class="control-item" id="filterDaysGroup" style="display:none;flex:2">
          <div style="display:flex;gap:6px;align-items:flex-end">
            <div class="form-group" style="margin:0;flex:1"><label>開始</label><input type="date" id="filterStartDate" onchange="updateUI()"></div>
            <span style="margin-bottom:6px;color:var(--text-3);font-size:12px">至</span>
            <div class="form-group" style="margin:0;flex:1"><label>結束</label><input type="date" id="filterEndDate" onchange="updateUI()"></div>
          </div>
        </div>
        <div class="control-item">
          <label>篩選分類</label>
          <select id="filterCategorySelect" onchange="updateUI()"><option value="ALL">全部</option></select>
        </div>
      </div>
      <div class="control-row">
        <div class="control-item" style="flex:1">
          <label>🔍 搜索備註 / 分類</label>
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchKeyword" placeholder="輸入關鍵字即時搜索…" autocomplete="off">
          </div>
          <div class="search-count" id="searchCount"></div>
        </div>
      </div>
    </div>
    <div class="history-list-wrapper" id="historyListWrapper"><div id="recordList"></div></div>
  </div>
</div>
<div class="sidebar">
  <div>
    <div class="section-title">備份與導出</div>
    <div class="backup-zone">
      <button class="btn-backup btn-success" onclick="exportToCSV()">📊 匯出 CSV</button>
      <button class="btn-backup btn-dark" onclick="triggerCSVImport()">📥 匯入 CSV</button>
      <input type="file" id="importCSVFileInput" accept=".csv" style="display:none" onchange="importFromCSV(event)">
    </div>
  </div>
  <div>
    <div class="section-title">帳戶資產</div>
    <div class="account-grid" id="accountGrid"></div>
  </div>
  <div>
    <div class="section-title">預算控管</div>
    <div style="background:var(--surface2);padding:10px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:10px">
      <label style="font-size:11px">預算月份</label>
      <select id="budgetMonthSelect" onchange="updateUI()" style="font-size:12px;padding:5px;margin-bottom:10px;height:30px"></select>

</div>
</div>
<script>
// ═══════════════════════════════════════════
//  常數
// ═══════════════════════════════════════════
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwtS-XCaLW48NLfV7xsZDbgJ5ptJ_2QjoQzAiDkJCQIWZUJ6MGuf3tmoYJT2f4qmd6Y/exec";
const LS = { records:'sl_records', budgets:'sl_budgets', groups:'sl_groups', accounts:'sl_accounts' };
const ACCOUNT_NAMES = ['現金','台灣銀行','newnewbank','郵局','二信','永豐','玉山信用卡','永豐信用卡','台新信用卡','富邦'];
const EXPENSE_DATA = {
  '餐飲食品':['早餐','午餐','晚餐','宵夜','飲料','點心零嘴','食材','水果'],
  '服飾美容':['衣服褲子','配件','鞋子','剪髮','保養品'],
  '居家生活':['傢俱','家電','房租','水費','電費','瓦斯費','網路費','電話費','保險費','稅務','阿曦','阿霄','訂閱支出','寶貝寵物','洗衣費用','生活用品','購屋費用'],
  '運輸交通':['計程車','高鐵','飛機','火車','船費','過路費','公車'],
  '教育學習':['文具','書籍','學貸','補習費'],
  '休閒娛樂':['電影','KTV','玩具小物','旅行遊玩','遊戲','彩券','運動健身','出國費用-日本'],
  '電子商品':['電腦及周邊','3C產品'],
  '汽機車':['油錢','停車費','保養費用','洗車費用','購車費用'],
  '醫療保健':['診所就醫','購買藥物','保健食品','健檢檢查'],
  '人情交際':['送禮','紅包','白包'],
  '理財投資':['股票','頭期貸款','房屋貸款'],
  '其他':['捐款','雜支','悠遊卡加值']
};
const INCOME_CATS = ['薪水','差旅費','利息','股票','其他'];

// ═══════════════════════════════════════════
//  狀態
// ═══════════════════════════════════════════
let records = [], budgets = {}, customGroupBudgets = {};
let accountBalances = Object.fromEntries(ACCOUNT_NAMES.map(n => [n, 0]));
let pieChart = null, barChart = null, lineChart = null;
let _lockDone = false;
let batchRowCounter = 0;

// ═══════════════════════════════════════════
//  工具函式
// ═══════════════════════════════════════════
const $ = id => document.getElementById(id);
const isCreditCard = n => n.includes('信用卡');

function toDateStr(d) {
  if (!d) return '';
  const s = String(d);
  return s.includes('T') ? s.slice(0, 10) : s;
}

function parseDate(s) {
  s = toDateStr(s);
  if (!s) return new Date();
  const p = s.split('-');
  if (p.length === 2) return new Date(+p[0], +p[1]-1, 1);
  if (p.length === 3) return new Date(+p[0], +p[1]-1, +p[2]);
  return new Date();
}

function showToast(msg, ms = 2500) {
  const t = $('toastMsg');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function highlight(text, kw) {
  if (!kw) return String(text || '');
  const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(text || '').replace(new RegExp(esc, 'gi'), m => `<span class="highlight">${m}</span>`);
}

function makeOptions(arr, el) {
  el.innerHTML = arr.map(v => `<option value="${v}">${v}</option>`).join('');
}

// ═══════════════════════════════════════════
//  LocalStorage
// ═══════════════════════════════════════════
function saveLocal() {
  localStorage.setItem(LS.records,  JSON.stringify(records));
  localStorage.setItem(LS.budgets,  JSON.stringify(budgets));
  localStorage.setItem(LS.groups,   JSON.stringify(customGroupBudgets));
  localStorage.setItem(LS.accounts, JSON.stringify(accountBalances));
}

function loadLocal() {
  try {
    const r = localStorage.getItem(LS.records);
    if (r) { records = JSON.parse(r); records.forEach(x => { x.date = toDateStr(x.date); }); }
    const b = localStorage.getItem(LS.budgets);  if (b) budgets = JSON.parse(b);
    const g = localStorage.getItem(LS.groups);   if (g) customGroupBudgets = JSON.parse(g);
    const a = localStorage.getItem(LS.accounts); if (a) accountBalances = JSON.parse(a);
  } catch(e) { console.error('[本機讀取]', e); }
}

// ═══════════════════════════════════════════
//  雲端
// ═══════════════════════════════════════════
function releaseLock() {
  if (_lockDone) return;
  _lockDone = true;
  $('cloudLoadingLock').style.display = 'none';
}

function setCloudStatus(msg, spinning) {
  $('cloudStatusText').textContent = msg;
  $('cloudStatusDot').className = 'sync-dot' + (spinning ? ' spinning' : '');
}

function buildPayload() {
  records.forEach(r => { r.date = toDateStr(r.date); });
  return {
    action: 'syncAll',
    accounts: ACCOUNT_NAMES.map(k => [k, accountBalances[k] || 0]),
    budgets: Object.entries(budgets),
    customGroupBudgets: JSON.stringify(customGroupBudgets),
    records
  };
}

function pushToCloud() {
  setCloudStatus('同步中...', true);
  fetch(CLOUD_URL, { method: 'POST', body: JSON.stringify(buildPayload()) })
    .then(r => r.json())
    .then(res => setCloudStatus(res.status === 'success' ? '已同步' : '❌ 失敗', false))
    .catch(() => setCloudStatus('⚠️ 離線', false));
}

function fetchCloudData() {
  setCloudStatus('連線中...', true);
  const fallback = reason => {
    console.warn('[雲端]', reason);
    setCloudStatus('離線模式', false);
    loadLocal();
    releaseLock();
    updateUI();
  };
  const timer = setTimeout(() => fallback('逾時 10s'), 10000);
  fetch(CLOUD_URL)
    .then(r => {
      const ct = r.headers.get('content-type') || '';
      if (!ct.includes('json') && !ct.includes('javascript'))
        return r.text().then(t => { throw new Error('非JSON: ' + t.slice(0,60)); });
      return r.json();
    })
    .then(res => {
      clearTimeout(timer);
      if (!res || res.status !== 'success' || !res.data) { fallback('雲端資料異常'); return; }
      const c = res.data;
      if (c.accounts && typeof c.accounts === 'object' && Object.keys(c.accounts).length > 0)
        accountBalances = c.accounts;
      if (c.budgets && typeof c.budgets === 'object') budgets = c.budgets;
      if (c.customGroupBudgets) {
        let cg = c.customGroupBudgets;
        if (typeof cg === 'string') { try { cg = JSON.parse(cg); } catch(e) { cg = {}; } }
        if (typeof cg === 'object') customGroupBudgets = cg;
      }
      if (Array.isArray(c.records)) {
        records = c.records;
        records.forEach(r => { r.date = toDateStr(r.date); });
        records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
        saveLocal();
      }
      setCloudStatus('已同步', false);
      releaseLock();
      updateUI();
    })
    .catch(err => { clearTimeout(timer); fallback(err.message); });
}

// ═══════════════════════════════════════════
//  UI 初始化
// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
//  動態批次多筆記帳 UI 邏輯
// ═══════════════════════════════════════════
function addBatchRow() {
  batchRowCounter++;
  const id = batchRowCounter;
  const todayStr = new Date().toISOString().slice(0,10);
  
  const rowHtml = `
    <div class="batch-row" id="batch-row-${id}">
      <div class="batch-cell" style="width: 90px;">
        <label>交易類型</label>
        <select id="batch-type-${id}" onchange="handleBatchTypeChange(${id})">
          <option value="支出">支出 💸</option>
          <option value="收入">收入 💰</option>
          <option value="轉帳">轉帳 🔄</option>
        </select>
      </div>
      <div class="batch-cell" style="width: 125px;">
        <label>交易日期</label>
        <input type="date" id="batch-date-${id}" value="${todayStr}">
      </div>
      
      <!-- 一般帳戶選擇 (支出、收入) -->
      <div class="batch-cell" id="batch-acc-group-${id}" style="width: 120px;">
        <label>交易帳戶</label>
        <select id="batch-account-${id}"></select>
      </div>
      
      <!-- 轉帳帳戶選擇 (隱藏) -->
      <div class="batch-cell" id="batch-from-group-${id}" style="width: 110px; display:none;">
        <label>轉出帳戶</label>
        <select id="batch-from-account-${id}"></select>
      </div>
      <div class="batch-cell" id="batch-to-group-${id}" style="width: 110px; display:none;">
        <label>轉入帳戶</label>
        <select id="batch-to-account-${id}"></select>
      </div>
      
      <!-- 分類選擇 -->
      <div class="batch-cell" id="batch-main-cat-group-${id}" style="width: 110px;">
        <label id="batch-main-label-${id}">支出大項</label>
        <select id="batch-main-cat-${id}" onchange="handleBatchMainCatChange(${id})"></select>
      </div>
      <div class="batch-cell" id="batch-sub-cat-group-${id}" style="width: 110px;">
        <label>支出小項</label>
        <select id="batch-sub-cat-${id}"></select>
      </div>
      
      <div class="batch-cell" style="width: 90px;">
        <label>金額</label>
        <input type="number" id="batch-amount-${id}" placeholder="金額" inputmode="decimal">
      </div>
      <div class="batch-cell" style="flex: 1;">
        <label>備註說明</label>
        <input type="text" id="batch-note-${id}" placeholder="選填備註">
      </div>
      <button class="btn-remove-row" onclick="removeBatchRow(${id})" title="移除此列">✕</button>
    </div>
  `;
  
  $('batchInputContainer').insertAdjacentHTML('beforeend', rowHtml);
  
  // 填入帳戶選項
  makeOptions(ACCOUNT_NAMES, $(`batch-account-${id}`));
  makeOptions(ACCOUNT_NAMES, $(`batch-from-account-${id}`));
  makeOptions(ACCOUNT_NAMES, $(`batch-to-account-${id}`));
  
  // 觸發初始類型選單渲染
  handleBatchTypeChange(id);
}

function removeBatchRow(id) {
  const row = $(`batch-row-${id}`);
  if (row) {
    if($('batchInputContainer').children.length > 1) {
      row.remove();
    } else {
      showToast('⚠️ 至少需要保留一筆輸入列');
    }
  }
}

function handleBatchTypeChange(id) {
  const type = $(`batch-type-${id}`).value;
  const isT = type === '轉帳', isI = type === '收入';
  
  $(`batch-acc-group-${id}`).style.display = isT ? 'none' : 'block';
  $(`batch-from-group-${id}`).style.display = isT ? 'block' : 'none';
  $(`batch-to-group-${id}`).style.display = isT ? 'block' : 'none';
  $(`batch-main-cat-group-${id}`).style.display = isT ? 'none' : 'block';
  $(`batch-sub-cat-group-${id}`).style.display = (isT || isI) ? 'none' : 'block';
  
  $(`batch-main-label-${id}`).textContent = isI ? '收入分類' : '支出大項';
  
  const ms = $(`batch-main-cat-${id}`);
  ms.innerHTML = '';
  if (!isT) {
    (isI ? INCOME_CATS : Object.keys(EXPENSE_DATA)).forEach(c => {
      const o = document.createElement('option');
      o.value = o.textContent = c;
      ms.appendChild(o);
    });
  }
  if (!isT && !isI) handleBatchMainCatChange(id);
}

function handleBatchMainCatChange(id) {
  const mainVal = $(`batch-main-cat-${id}`).value;
  makeOptions(EXPENSE_DATA[mainVal] || [], $(`batch-sub-cat-${id}`));
}

function handleEditTypeChange() { syncTypeUI('edit'); }
function handleEditMainCatChange() { makeOptions(EXPENSE_DATA[$('editMainCategory').value] || [], $('editSubCategory')); }

function syncTypeUI(prefix) {
  const type = $('editType').value;
  const isT = type === '轉帳', isI = type === '收入';
  const s = (id, v) => { const e = $(id); if (e) e.style.display = v; };
  s('editNormalAccGroup', isT ? 'none' : 'block');
  s('editTransferGroup', isT ? 'flex' : 'none');
  s('editCategoryRow', isT ? 'none' : 'flex');
  s('editSubCategoryGroup', isI ? 'none' : 'block');
  $('editMainCatLabel').textContent = isI ? '收入分類' : '支出大項';
  const ms = $('editMainCategory'); ms.innerHTML = '';
  if (!isT) { (isI ? INCOME_CATS : Object.keys(EXPENSE_DATA)).forEach(c => { const o = document.createElement('option'); o.value = o.textContent = c; ms.appendChild(o); }); }
  if (!isT && !isI) handleEditMainCatChange();
}

// 🚀 批次新增儲存功能
function addBatchRecords() {
  const rows = $('batchInputContainer').children;
  let addedCount = 0;
  let validRecords = [];

  for (let row of rows) {
    const rowId = row.id.replace('batch-row-', '');
    const type = $(`batch-type-${rowId}`).value;
    const amount = parseInt($(`batch-amount-${rowId}`).value);
    const note = $(`batch-note-${rowId}`).value.trim();
    const date = toDateStr($(`batch-date-${rowId}`).value);

    // 金額為空或小於等於 0 則視為不輸入（跳過）
    if (isNaN(amount) || amount <= 0) continue;
    if (!date) { showToast('⚠️ 請確實選擇日期'); return; }

    const rec = { id: Date.now() + addedCount, type, amount, note: note || '無備註', date };
    if (type === '轉帳') {
      const from = $(`batch-from-account-${rowId}`).value;
      const to = $(`batch-to-account-${rowId}`).value;
      if (from === to) { showToast('⚠️ 轉帳帳戶不能相同'); return; }
      rec.fromAccount = from; rec.toAccount = to;
    } else {
      rec.account = $(`batch-account-${rowId}`).value;
      rec.mainCategory = $(`batch-main-cat-${rowId}`).value;
      rec.subCategory = type === '支出' ? $(`batch-sub-cat-${rowId}`).value : '';
    }
    validRecords.push(rec);
    addedCount++;
  }

  if (validRecords.length === 0) {
    showToast('⚠️ 沒有可新增的有效帳目資料（請填入金額）');
    return;
  }

  // 合併至主要資歷庫
  records.push(...validRecords);
  records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
  
  saveLocal(); 
  updateUI(); 
  pushToCloud();
  
  // 清空輸入表單，只保留一列全新空白
  $('batchInputContainer').innerHTML = '';
  addBatchRow();
  showToast(`✅ 成功批次同步新增 ${addedCount} 筆交易！`);
}

// ═══════════════════════════════════════════
//  Modal 編輯
// ═══════════════════════════════════════════
function openEditModal(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  $('editRecordId').value = r.id;
  $('editType').value    = r.type;
  $('editDate').value    = r.date;
  $('editAmount').value  = r.amount;
  $('editNote').value    = r.note === '無備註' ? '' : (r.note || '');
  syncTypeUI('edit');
  if (r.type === '轉帳') {
    $('editFromAccount').value = r.fromAccount || '';
    $('editToAccount').value   = r.toAccount   || '';
  } else {
    $('editAccount').value = r.account || '';
    const ms = $('editMainCategory');
    [...ms.options].forEach(o => { o.selected = o.value === r.mainCategory; });
    handleEditMainCatChange();
    if (r.subCategory) { const ss = $('editSubCategory'); [...ss.options].forEach(o => { o.selected = o.value === r.subCategory; }); }
  }
  $('editModal').style.display = 'flex';
}

function closeEditModal() { $('editModal').style.display = 'none'; }

function saveEditRecord() {
  const id  = parseInt($('editRecordId').value);
  const idx = records.findIndex(x => x.id === id); if (idx === -1) return;
  const type   = $('editType').value;
  const amount = parseInt($('editAmount').value);
  const note   = $('editNote').value.trim();
  const date   = toDateStr($('editDate').value);
  if (!date || isNaN(amount) || amount <= 0) { showToast('⚠️ 請填入日期與金額'); return; }
  const updated = { id, type, amount, note: note || '無備註', date };
  if (type === '轉帳') {
    const from = $('editFromAccount').value, to = $('editToAccount').value;
    if (from === to) { showToast('⚠️ 轉帳帳戶不能相同'); return; }
    updated.fromAccount = from; updated.toAccount = to;
  } else {
    updated.account      = $('editAccount').value;
    updated.mainCategory = $('editMainCategory').value;
    updated.subCategory  = type === '支出' ? $('editSubCategory').value : '';
  }
  records[idx] = updated;
  records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
  saveLocal(); updateUI(); pushToCloud();
  closeEditModal();
  showToast('✅ 已更新');
}

function deleteRecord(id) {
  if (!confirm('確定刪除這筆記錄？')) return;
  records = records.filter(r => r.id !== id);
  saveLocal(); updateUI(); pushToCloud();
  showToast('🗑️ 已刪除');
}

function clearAllRecords() {
  if (!confirm('確定清空全部明細？此操作無法還原！')) return;
  records = []; saveLocal(); updateUI(); pushToCloud();
}

// ═══════════════════════════════════════════
//  帳戶 & 預算
// ═══════════════════════════════════════════
function updateAccountInit(name) {
  const v = parseInt($(`input-${name}`).value); if (isNaN(v)) return;
  accountBalances[name] = v; $(`input-${name}`).value = '';
  saveLocal(); updateUI(); pushToCloud();
  showToast(`✅ ${name} 已更新`);
}

function saveBudget() {
  const cat = $('budgetCategory').value, amt = parseInt($('budgetAmountInput').value);
  if (isNaN(amt) || amt < 0) return;
  budgets[cat] = amt; $('budgetAmountInput').value = '';
  saveLocal(); updateUI(); pushToCloud();
  showToast(`✅ 「${cat}」預算設定完成`);
}

// ═══════════════════════════════════════════
//  自訂預算群組
// ═══════════════════════════════════════════
function saveCustomGroupBudget() {
  const name = $('customGroupName').value.trim();
  const amt  = parseInt($('customGroupAmount').value);
  const subs = [...$('customGroupSubCats').selectedOptions].map(o => o.value);
  if (!name) { showToast('⚠️ 請填寫群組名稱'); return; }
  if (isNaN(amt) || amt < 0) { showToast('⚠️ 請輸入有效金額'); return; }
  if (subs.length === 0) { showToast('⚠️ 請至少選一個細項'); return; }
  customGroupBudgets[name] = { limit: amt, subCats: subs };
  $('customGroupName').value = ''; $('customGroupAmount').value = '';
  $('customGroupSubCats').selectedIndex = -1;
  saveLocal(); updateUI(); pushToCloud();
  showToast(`✅ 群組「${name}」建立完成`);
}

function editBudgetAmount(cat, old) {
  const s = prompt(`「${cat}」新預算：`, old); if (s === null) return;
  const n = parseInt(s); if (isNaN(n) || n < 0) return;
  budgets[cat] = n; saveLocal(); updateUI(); pushToCloud();
}
function editCustomGroupAmount(name, old) {
  const s = prompt(`群組「${name}」新預算：`, old); if (s === null) return;
  const n = parseInt(s); if (isNaN(n) || n < 0) return;
  customGroupBudgets[name].limit = n; saveLocal(); updateUI(); pushToCloud();
}
function deleteBudget(cat) { if (!confirm(`確定刪除「${cat}」月預算？`)) return; delete budgets[cat]; saveLocal(); updateUI(); pushToCloud(); }
function deleteCustomGroupBudget(name) { if (!confirm(`確定刪除群組「${name}」？`)) return; delete customGroupBudgets[name]; saveLocal(); updateUI(); pushToCloud(); }

// ═══════════════════════════════════════════
//  CSV
// ═══════════════════════════════════════════
function exportToCSV() {
  let csv = "=== 系統帳戶初始設定配額 ===\n帳戶名稱,初始金額\n";
  ACCOUNT_NAMES.forEach(n => { csv += `${n},${accountBalances[n]}\n`; });
  csv += "=== 明細流水帳紀錄開始 ===\n交易日期,交易類型,主分類/大項,子分類/小項,交易帳戶/細節,金額,備註說明\n";
  records.forEach(r => {
    let row = [toDateStr(r.date), r.type];
    if (r.type === '轉帳') row.push('內部轉帳', '-', `從 [${r.fromAccount}] 轉到 [${r.toAccount}]`);
    else row.push(r.mainCategory||'', r.subCategory||'-', r.account||'');
    row.push(r.amount, String(r.note||'').replace(/,/g,' '));
    csv += row.join(',') + "\n";
  });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'})),
    download: `智慧記帳本_${new Date().toISOString().slice(0,10)}.csv`
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('📊 CSV 已匯出');
}

function triggerCSVImport() { $('importCSVFileInput').click(); }

function importFromCSV(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split('\n');
      let imported = [], parsedAcc = {...accountBalances}, readingRecs = false;
      lines.forEach((line, i) => {
        line = line.trim(); if (!line) return;
        if (line.includes('=== 明細流水帳紀錄開始 ===')) { readingRecs = true; return; }
        if (!readingRecs) {
          const p = line.split(',');
          if (p.length === 2 && ACCOUNT_NAMES.includes(p[0].trim())) parsedAcc[p[0].trim()] = parseInt(p[1].trim()) || 0;
        } else {
          const c = line.split(','); if (c.length < 6) return;
          const item = { id: Date.now()+i, date: toDateStr(c[0].trim()), type: c[1].trim(), amount: parseInt(c[5].trim())||0, note: c[6]?c[6].trim():'無備註' };
          if (item.type === '轉帳') { const m = c[4].trim().match(/從 \[(.*?)\] 轉到 \[(.*?)\]/); if (m) { item.fromAccount = m[1]; item.toAccount = m[2]; } }
          else { item.mainCategory = c[2].trim(); item.subCategory = c[3].trim()==='-'?'':c[3].trim(); item.account = c[4].trim(); }
          imported.push(item);
        }
      });
      if (!confirm(`確認匯入 ${imported.length} 筆資料並覆蓋雲端？`)) return;
      accountBalances = parsedAcc;
      records = imported.sort((a, b) => parseDate(b.date) - parseDate(a.date));
      saveLocal(); updateUI(); pushToCloud();
      showToast(`✅ 已匯入 ${imported.length} 筆`);
    } catch(err) { showToast('❌ 匯入失敗：' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
}

// ═══════════════════════════════════════════
//  UI 開關
// ═══════════════════════════════════════════
function handleTimeModeChange() {
  const m = $('filterTimeMode').value;
  $('filterMonthGroup').style.display = m === 'month' ? 'block' : 'none';
  $('filterDaysGroup').style.display  = m === 'days'  ? 'block' : 'none';
  updateUI();
}
function toggleHistoryCollapse() {
  const w = $('historyListWrapper'), b = $('btnToggleCollapse');
  b.textContent = w.classList.toggle('collapsed') ? '📁 展開' : '📂 收合';
}
function toggleChartsCollapse() {
  const w = $('chartsWrapper'), b = $('btnToggleCharts');
  const c = w.classList.toggle('collapsed');
  b.textContent = c ? '📊 展開圖表' : '📊 收合圖表';
  if (!c) updateUI();
}

// ═══════════════════════════════════════════
//  主渲染
// ═══════════════════════════════════════════
function updateUI() {
  const selBudgetMonth = $('budgetMonthSelect').value;
  const bDate = parseDate(selBudgetMonth);
  const bYear = bDate.getFullYear(), bMon = bDate.getMonth() + 1;
  const chartStart = parseDate($('analysisStartDate').value);
  const chartEnd   = parseDate($('analysisEndDate').value);
  const filterMode  = $('filterTimeMode').value;
  const filterMonth = $('filterMonthSelect').value;
  const filterStart = parseDate($('filterStartDate').value);
  const filterEnd   = parseDate($('filterEndDate').value);
  const filterCat   = $('filterCategorySelect').value;
  const kw    = $('searchKeyword').value.trim();
  const kwLow = kw.toLowerCase();

  const balances     = {...accountBalances};
  const expChart     = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const incChart     = Object.fromEntries(INCOME_CATS.map(k => [k, 0]));
  const monBudSpent  = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const yearBudSpent = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const grpMonSpent  = Object.fromEntries(Object.keys(customGroupBudgets).map(k => [k, 0]));
  const grpYrSpent   = Object.fromEntries(Object.keys(customGroupBudgets).map(k => [k, 0]));
  const assetLine    = {};
  let totalInc = 0, totalExp = 0;

  [...records].reverse().forEach(r => {
    r.date = toDateStr(r.date);
    const rDate = parseDate(r.date);
    const rYM   = r.date.slice(0, 7);
    const rYear = parseInt(r.date.slice(0, 4));
    const rMon  = parseInt(r.date.slice(5, 7));

    if (r.type === '轉帳') {
      if (balances[r.fromAccount] !== undefined) balances[r.fromAccount] -= r.amount;
      if (balances[r.toAccount]   !== undefined) {
        if (isCreditCard(r.toAccount)) balances[r.toAccount] -= r.amount;
        else balances[r.toAccount] += r.amount;
      }
    } else if (r.type === '收入') {
      totalInc += r.amount;
      if (balances[r.account] !== undefined) balances[r.account] += r.amount;
      if (rDate >= chartStart && rDate <= chartEnd && incChart[r.mainCategory] !== undefined)
        incChart[r.mainCategory] += r.amount;
    } else {
      totalExp += r.amount;
      if (balances[r.account] !== undefined) {
        if (isCreditCard(r.account)) balances[r.account] += r.amount;
        else balances[r.account] -= r.amount;
      }
      if (rYM === selBudgetMonth) {
        if (monBudSpent[r.mainCategory] !== undefined) monBudSpent[r.mainCategory] += r.amount;
        Object.entries(customGroupBudgets).forEach(([g, cfg]) => { if (cfg.subCats?.includes(r.subCategory)) grpMonSpent[g] = (grpMonSpent[g]||0) + r.amount; });
      }
      if (rYear === bYear && rMon <= bMon) {
        if (yearBudSpent[r.mainCategory] !== undefined) yearBudSpent[r.mainCategory] += r.amount;
        Object.entries(customGroupBudgets).forEach(([g, cfg]) => { if (cfg.subCats?.includes(r.subCategory)) grpYrSpent[g] = (grpYrSpent[g]||0) + r.amount; });
      }
      if (rDate >= chartStart && rDate <= chartEnd && expChart[r.mainCategory] !== undefined)
        expChart[r.mainCategory] += r.amount;
    }
    let tA = 0, tL = 0;
    ACCOUNT_NAMES.forEach(n => isCreditCard(n) ? tL += (balances[n]||0) : tA += (balances[n]||0));
    assetLine[r.date] = tA - tL;
  });

  // 看板
  $('totalIncome').textContent  = totalInc.toLocaleString();
  $('totalExpense').textContent = totalExp.toLocaleString();
  let totA = 0, totL = 0;
  ACCOUNT_NAMES.forEach(n => {
    const v = balances[n] || 0, ve = $(`val-${n}`);
    if (isCreditCard(n)) {
      ve.textContent = v > 0 ? `欠 $${v.toLocaleString()}` : '$0';
      ve.style.color = v > 0 ? 'var(--danger)' : 'var(--text-3)';
      totL += v;
    } else {
      ve.textContent = `$${v.toLocaleString()}`;
      ve.style.color = v < 0 ? 'var(--danger)' : 'var(--text)';
      totA += v;
    }
  });
  const net = totA - totL, netEl = $('netBalance');
  netEl.textContent = `$${net.toLocaleString()}`;
  netEl.style.color = net < 0 ? '#fca5a5' : 'white';

  // 明細列表
  let html = '', count = 0;
  records.forEach(r => {
    r.date = toDateStr(r.date);
    const rDate = parseDate(r.date);
    const passTime = filterMode === 'month' ? r.date.slice(0,7) === filterMonth : rDate >= filterStart && rDate <= filterEnd;
    const passCat  = filterCat === 'ALL' ? true : filterCat === '內部轉帳' ? r.type === '轉帳' : r.type !== '轉帳' && r.mainCategory === filterCat;
    
    let passKw = true;
    if (kwLow) {
      if (r.type === '轉帳') {
        passKw = [r.note, '轉帳', '內部轉帳', r.fromAccount, r.toAccount].some(f => String(f || '').toLowerCase().includes(kwLow));
      } else {
        passKw = [r.note, r.mainCategory, r.subCategory, r.account].some(f => String(f || '').toLowerCase().includes(kwLow));
      }
    }

    if (!passTime || !passCat || !passKw) return;
    count++;

    const noteHl = highlight(r.note || '', kw);
    const actions = `<button class="btn-item-action btn-item-edit" onclick="openEditModal(${r.id})" title="編輯">✏️</button>
                     <button class="btn-item-action btn-item-delete" onclick="deleteRecord(${r.id})" title="刪除">✕</button>`;

    if (r.type === '轉帳') {
      html += `<div class="history-item">
        <div class="item-left transfer-border">
          <div class="item-date">${r.date}</div>
          <div class="item-title"><span class="item-acc-tag" style="background:#f3f0ff;color:#7048e8">🔄 轉帳</span> ${highlight(r.fromAccount||'', kw)} → ${highlight(r.toAccount||'', kw)}</div>
          <div class="item-note">${noteHl}</div>
        </div>
        <div class="item-right"><div class="item-amount" style="color:var(--purple)">$${r.amount.toLocaleString()}</div>${actions}</div>
      </div>`;
    } else {
      const isInc = r.type === '收入';
      html += `<div class="history-item">
        <div class="item-left ${isInc ? 'income-border' : 'expense-border'}">
          <div class="item-date">${r.date}</div>
          <div class="item-title"><span class="item-acc-tag">${r.account||''}</span> ${highlight(r.mainCategory||'', kw)}${!isInc && r.subCategory ? `<span class="item-sub-tag">${highlight(r.subCategory, kw)}</span>` : ''}</div>
          <div class="item-note">${noteHl}</div>
        </div>
        <div class="item-right"><div class="item-amount" style="color:${isInc?'var(--success)':'var(--danger)'}">${isInc?'+':'−'}$${r.amount.toLocaleString()}</div>${actions}</div>
      </div>`;
    }
  });

  $('searchCount').textContent = kw ? `找到 ${count} 筆含「${kw}」的記錄` : (count > 0 ? `共 ${count} 筆` : '');
  $('recordList').innerHTML = count === 0
    ? `<p style="text-align:center;color:var(--text-3);font-size:13px;padding:24px 0">${kw ? `找不到含「${kw}」的記錄` : '此期間無記錄'}</p>`
    : html;

  // 預算
  const budgetEl = $('budgetListSection'); budgetEl.innerHTML = '';
  let hasAny = false, sumB = 0, sumS = 0, sumYB = 0, sumYS = 0;

  for (const cat in budgets) {
    hasAny = true;
    const limit = budgets[cat], spent = monBudSpent[cat]||0, rem = limit - spent;
    const yLimit = limit * bMon, ySpent = yearBudSpent[cat]||0;
    sumB += limit; sumS += spent; sumYB += yLimit; sumYS += ySpent;
    const pct = limit > 0 ? Math.min((spent/limit)*100, 100) : 0, over = spent > limit;
    budgetEl.insertAdjacentHTML('beforeend', `<div class="budget-item">
      <div class="budget-info"><span>🏷️ <strong>${cat}</strong></span>
        <div class="budget-action-btns">
          <span style="color:${over?'var(--danger)':'var(--success)'};font-weight:700;font-size:11px">${over?'超 $'+Math.abs(rem).toLocaleString():'餘 $'+rem.toLocaleString()}</span>
          <button class="btn-budget-edit" onclick="editBudgetAmount('${cat}',${limit})">✏️</button>
          <button class="btn-budget-delete" onclick="deleteBudget('${cat}')">✕</button>
        </div>
      </div>
      <div style="color:var(--text-3);font-size:10px;margin-bottom:3px">已花 $${spent.toLocaleString()} / 預算 $${limit.toLocaleString()}</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill${over?' progress-over':''}" style="width:${pct}%"></div></div>
    </div>`);
  }

  for (const gn in customGroupBudgets) {
    hasAny = true;
    const g = customGroupBudgets[gn], limit = g.limit, spent = grpMonSpent[gn]||0, rem = limit - spent;
    const yLimit = limit * bMon, ySpent = grpYrSpent[gn]||0;
    sumB += limit; sumS += spent; sumYB += yLimit; sumYS += ySpent;
    const pct = limit > 0 ? Math.min((spent/limit)*100, 100) : 0;
    const yPct = yLimit > 0 ? Math.min((ySpent/yLimit)*100, 100) : 0;
    const over = spent > limit, yOver = ySpent > yLimit;
    budgetEl.insertAdjacentHTML('beforeend', `<div class="budget-item custom-budget-item">
      <div class="budget-info"><span style="color:var(--primary)">🧩 <strong>${gn}</strong></span>
        <div class="budget-action-btns">
          <span style="color:${over?'var(--danger)':'var(--success)'};font-weight:700;font-size:11px">${over?'超 $'+Math.abs(rem).toLocaleString():'餘 $'+rem.toLocaleString()}</span>
          <button class="btn-budget-edit" onclick="editCustomGroupAmount('${gn}',${limit})">✏️</button>
          <button class="btn-budget-delete" onclick="deleteCustomGroupBudget('${gn}')">✕</button>
        </div>
      </div>
      <div style="color:var(--text-2);font-size:10px;margin-bottom:2px">包含: ${g.subCats?g.subCats.join(', '):''}</div>
      <div style="color:var(--text-3);font-size:10px">當月 $${spent.toLocaleString()} / $${limit.toLocaleString()}</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill${over?' progress-over':''}" style="width:${pct}%"></div></div>
      <div style="color:var(--text-3);font-size:10px;margin-top:3px">年度 $${ySpent.toLocaleString()} / $${yLimit.toLocaleString()}</div>
      <div class="progress-bar-bg year-bg"><div class="progress-bar-fill year-fill${yOver?' progress-over':''}" style="width:${yPct}%"></div></div>
    </div>`);
  }

  const bs = $('budgetSummaryBox');
  if (hasAny) {
    bs.style.display = 'flex';
    $('sumTotalBudget').textContent = `$${sumB.toLocaleString()}`;
    $('sumTotalSpent').textContent  = `$${sumS.toLocaleString()}`;
    const tr = sumB - sumS, trEl = $('sumTotalRemaining');
    trEl.textContent = tr >= 0 ? `$${tr.toLocaleString()}` : `超 $${Math.abs(tr).toLocaleString()}`;
    trEl.style.color = tr >= 0 ? 'var(--success)' : 'var(--danger)';
    $('yearTotalBudget').textContent = `$${sumYB.toLocaleString()}`;
    $('yearTotalSpent').textContent  = `$${sumYS.toLocaleString()}`;
    const yr = sumYB - sumYS, yrEl = $('yearTotalRemaining');
    yrEl.textContent = yr >= 0 ? `$${yr.toLocaleString()}` : `超 $${Math.abs(yr).toLocaleString()}`;
    yrEl.style.color = yr >= 0 ? 'var(--success)' : 'var(--danger)';
  } else {
    bs.style.display = 'none';
    budgetEl.innerHTML = `<p style="color:var(--text-3);text-align:center;font-size:12px;padding:8px 0">尚未設定任何預算項目</p>`;
  }

  if (!$('chartsWrapper').classList.contains('collapsed'))
    renderCharts(chartStart, chartEnd, expChart, incChart, assetLine);
}

// ═══════════════════════════════════════════
//  圖表
// ═══════════════════════════════════════════
function renderCharts(start, end, expMap, incMap, assetLine) {
  const totalExp = Object.values(expMap).reduce((a,b)=>a+b,0);
  const expLabels = Object.keys(expMap).filter(k=>expMap[k]>0).map(k=>`${k} ($${expMap[k].toLocaleString()})`);
  const expVals   = Object.keys(expMap).filter(k=>expMap[k]>0).map(k=>expMap[k]);
  if (pieChart) pieChart.destroy();
  pieChart = new Chart($('expensePieChart').getContext('2d'), {
    type: 'doughnut',
    data: { labels: expLabels, datasets: [{ data: expVals, backgroundColor: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#1abc9c','#e67e22','#34495e','#95a5a6','#d35400','#c0392b','#7f8c8d'], borderWidth: 1 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 9, font: { size: 9 } } } } },
    plugins: [{ id: 'cp', beforeDraw(chart) {
      const ctx = chart.ctx, cx = (chart.chartArea.left+chart.chartArea.right)/2, cy = (chart.chartArea.top+chart.chartArea.bottom)/2;
      ctx.restore(); ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#718096'; ctx.textBaseline = 'middle';
      const t1 = '總支出'; ctx.fillText(t1, cx - ctx.measureText(t1).width/2, cy-9);
      ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#e74c3c';
      const t2 = `$${totalExp.toLocaleString()}`; ctx.fillText(t2, cx - ctx.measureText(t2).width/2, cy+9);
      ctx.save();
    }}]
  });

  const incLabels = Object.keys(incMap).filter(k=>incMap[k]>0), incVals = incLabels.map(k=>incMap[k]);
  if (barChart) barChart.destroy();
  barChart = new Chart($('incomeBarChart').getContext('2d'), {
    type: 'bar',
    data: { labels: incLabels, datasets: [{ label: '進帳', data: incVals, backgroundColor: '#2f9e44', borderRadius: 5 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  let tlMap = {}; let cur = new Date(start);
  while (cur <= end) { tlMap[cur.toISOString().slice(0,10)] = 0; cur.setDate(cur.getDate()+1); }
  Object.keys(tlMap).forEach(d => {
    if (assetLine[d] !== undefined) { tlMap[d] = assetLine[d]; return; }
    let fb = 0; Object.keys(assetLine).forEach(t => { if (parseDate(t) <= parseDate(d)) fb = assetLine[t]; });
    tlMap[d] = fb;
  });
  const ll = Object.keys(tlMap).sort(), lv = ll.map(d=>tlMap[d]);
  if (lineChart) lineChart.destroy();
  lineChart = new Chart($('assetLineChart').getContext('2d'), {
    type: 'line',
    data: { labels: ll, datasets: [{ label: '資產淨值', data: lv, borderColor: '#3b5bdb', backgroundColor: 'rgba(59,91,219,.05)', tension: 0.2, fill: true, borderWidth: 2, pointRadius: 1 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

// ═══════════════════════════════════════════
//  啟動
// ═══════════════════════════════════════════
(function init() {
  const today = new Date(), ts = today.toISOString().slice(0,10);
  const yr = today.getFullYear(), mo = String(today.getMonth()+1).padStart(2,'0');
  $('analysisStartDate').value = `${yr}-${mo}-01`;
  $('analysisEndDate').value   = ts;
  $('filterStartDate').value   = `${yr}-${mo}-01`;
  $('filterEndDate').value     = ts;

  initAccountUI();
  initSelects();
  initMonthSelects();
  initFilterCats();
  initCustomGroupSubCats();

  // 初始化新增第一行多筆輸入列
  addBatchRow();

  // 搜尋框事件監聽器
  $('searchKeyword').addEventListener('input', updateUI);

  // 監聽 ESC 鍵關閉 Modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeEditModal();
  });

  fetchCloudData();
})();

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的智慧帳本</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght=500;700;900&family=Noto+Sans+TC:wght=400;500;600;700&family=JetBrains+Mono:wght=500;600;700&display=swap');

/* ══════════════════════════════════════════════════════
   設計語彙：綠色格線帳簿紙 × 存摺印章
   ══════════════════════════════════════════════════════ */
:root {
  --paper:      #E8F1E4;   /* 帳簿淡綠紙 */
  --paper-deep: #DCEAD6;
  --surface:    #FCFDFB;   /* 卡片/輸入底色，近白 */
  --surface-2:  #F3F7F0;
  --rule:       rgba(28,58,38,.16);   /* 格線 */
  --rule-soft:  rgba(28,58,38,.08);
  --ink:        #1B2B20;   /* 主文字：墨綠黑 */
  --ink-soft:   #4C5F51;
  --ink-faint:  #86988A;
  --stamp:      #B8402A;   /* 朱印紅：主色 / 支出 */
  --stamp-dark: #8E301F;
  --stamp-wash: #FBEAE5;
  --seal-navy:  #33507E;   /* 核印藍：轉帳 */
  --seal-navy-wash:#E8EDF6;
  --success:    #2E7D4F;   /* 收入綠 */
  --success-wash:#E4F2E8;
  --gold:       #A9772F;   /* 點綴金 */
  --danger:     var(--stamp);
  --danger-wash:var(--stamp-wash);
  --radius: 8px; --radius-lg:14px;
  --shadow: 0 2px 10px rgba(27,43,32,.08), 0 8px 24px rgba(27,43,32,.05);
  --tr:.16s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

html{scrollbar-color:var(--rule) transparent}
body{
  font-family:'Noto Sans TC',-apple-system,sans-serif;
  background:
    repeating-linear-gradient(var(--paper),var(--paper) 27px,var(--rule-soft) 28px),
    var(--paper);
  margin:0;padding:20px;color:var(--ink);font-size:14px;line-height:1.5;
}
:focus-visible{outline:2px solid var(--seal-navy);outline-offset:2px;border-radius:4px}

#cloudLoadingLock{position:fixed;inset:0;background:rgba(232,241,228,.96);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.lock-spinner{width:36px;height:36px;border:3px solid var(--rule);border-top-color:var(--stamp);border-radius:50%;animation:spin .8s linear infinite}
#lockStatusText{font-size:13px;font-weight:600;color:var(--ink-soft);letter-spacing:.3px}
@keyframes spin{to{transform:rotate(360deg)}}

.main-layout{display:flex;gap:18px;width:100%;max-width:1440px;margin:0 auto}

.container,.sidebar{position:relative;background:var(--surface);padding:24px 24px 24px 30px;border-radius:var(--radius-lg);box-shadow:var(--shadow);min-width:0}
.container::before,.sidebar::before{
  content:'';position:absolute;left:0;top:22px;bottom:22px;width:14px;
  background-image:radial-gradient(circle,var(--paper) 2.6px,transparent 2.7px);
  background-size:14px 22px;background-repeat:repeat-y;background-position:3px 0;
  border-right:1px dashed var(--rule);
}
.container{flex:1.35}
.sidebar{flex:0.65;display:flex;flex-direction:column;gap:20px;min-width:260px;max-width:360px}

.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.app-title{font-family:'Noto Serif TC',serif;font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px;letter-spacing:.5px;color:var(--ink)}
.cloud-status-bar{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-soft);padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.sync-dot.spinning{background:transparent;border:2px solid var(--stamp);border-top-color:transparent;animation:spin .8s linear infinite;width:10px;height:10px}

.dashboard{
  position:relative;overflow:hidden;
  background:linear-gradient(150deg,#1B2B20,#233A2A 55%,#2D4636);
  color:#EEF4EC;padding:20px 22px;border-radius:12px;margin-bottom:18px;
}
.dashboard::after{
  content:'帳';position:absolute;right:16px;top:14px;
  width:52px;height:52px;border:2.5px solid rgba(184,64,42,.75);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;color:rgba(184,64,42,.8);
  transform:rotate(-14deg);opacity:.85;
}
.balance-title{font-size:10.5px;color:rgba(238,244,236,.55);text-align:center;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.balance-amount{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:33px;font-weight:700;text-align:center;margin:6px 0 14px;letter-spacing:-.5px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid rgba(238,244,236,.15);padding-top:12px;position:relative}
.stat-box{text-align:center}
.stat-label{font-size:10px;color:rgba(238,244,236,.5);letter-spacing:.4px}
.stat-value{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;margin-top:2px}
.text-income{color:#8FE0AE}.text-expense{color:#F0A08F}

.section-title{font-family:'Noto Serif TC',serif;font-size:13px;font-weight:700;letter-spacing:.4px;color:var(--ink-soft);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.section-title::before{content:'';display:block;width:4px;height:14px;background:var(--stamp);border-radius:1px}

.batch-container{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.batch-row{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:10px;align-items:flex-end;position:relative}
.batch-cell{display:flex;flex-direction:column;gap:3px;min-width:85px}
.batch-cell label{font-size:10px;color:var(--ink-soft);font-weight:600}
.batch-cell input,.batch-cell select{padding:6px 8px;font-size:12px;height:31px;border-radius:6px}
.btn-remove-row{background:var(--stamp-wash);color:var(--stamp);border:1px solid #f0c9c0;width:31px;height:31px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold;transition:all var(--tr);flex:0 0 auto}
.btn-remove-row:hover{background:var(--stamp);color:#fff}
.batch-actions{display:flex;gap:10px;margin-bottom:14px}

.form-group{margin-bottom:10px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1;margin-bottom:0}
label{display:block;margin-bottom:4px;color:var(--ink-soft);font-weight:600;font-size:11px;letter-spacing:.3px}
input,select{width:100%;padding:7px 10px;border:1.5px solid var(--rule);border-radius:6px;font-size:13px;background:var(--surface);color:var(--ink);transition:border-color var(--tr),box-shadow var(--tr);font-family:inherit}
input:focus,select:focus{border-color:var(--seal-navy);outline:none;box-shadow:0 0 0 3px rgba(51,80,126,.12)}
input[type=number],input[type=date]{font-family:'JetBrains Mono',monospace}

button{padding:7px 14px;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);font-family:inherit}
button:active{transform:scale(.97)}
.btn-primary{background:var(--stamp);width:100%;padding:12px;font-size:14px;margin-top:4px;letter-spacing:.5px;box-shadow:0 2px 0 var(--stamp-dark)}
.btn-primary:hover{background:#C6492F;transform:translateY(-1px)}
.btn-primary:active{transform:translateY(1px) scale(.99);box-shadow:0 1px 0 var(--stamp-dark)}
.btn-primary:disabled{background:#c9b8ab;box-shadow:none;cursor:not-allowed;transform:none}
.btn-sm{font-size:11px;padding:3px 8px}
.btn-ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--rule)}
.btn-ghost:hover{background:var(--rule-soft);color:var(--ink)}
.btn-success{background:var(--success)}.btn-success:hover{background:#256b42}
.btn-danger{background:var(--stamp)}.btn-danger:hover{background:#C6492F}
.btn-dark{background:var(--ink)}.btn-dark:hover{background:#0f1a13}
.btn-backup{font-size:12px;width:100%;padding:9px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-toggle-view{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--rule);font-size:11px;padding:4px 9px}
.btn-toggle-view:hover{background:var(--rule-soft)}
.shortcut-hint{font-size:10px;color:var(--ink-faint);margin-top:4px;text-align:right}

.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.account-card{background:var(--surface-2);border:1px solid var(--rule);padding:9px 10px;border-radius:8px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.account-card.credit{border-left:3px solid var(--stamp)}
.account-card.asset{border-left:3px solid var(--success)}
.account-name{font-size:11px;font-weight:700;color:var(--ink-soft)}
.account-val{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;margin:2px 0}
.account-input-group{display:flex;gap:4px;margin-top:4px}
.account-input-group input{padding:3px 5px;font-size:11px;height:22px}
.account-input-group button{font-size:10px;padding:2px 6px;background:var(--seal-navy)}

.history-controls{background:var(--surface-2);padding:10px 12px;border-radius:9px;border:1px solid var(--rule);margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.control-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.control-item{flex:1;min-width:130px}
.control-item label{font-size:11px;margin-bottom:2px}
.control-item select,.control-item input{padding:5px 8px;font-size:12px}
.search-wrap{position:relative}
.search-wrap input{padding-left:28px}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.4;pointer-events:none}
.search-count{font-size:10px;color:var(--ink-faint);margin-top:3px;min-height:14px}
.history-list-wrapper{max-height:420px;overflow-y:auto;padding-right:2px}
.history-list-wrapper.collapsed{display:none}
.history-list-wrapper::-webkit-scrollbar{width:5px}
.history-list-wrapper::-webkit-scrollbar-track{background:var(--surface-2);border-radius:10px}
.history-list-wrapper::-webkit-scrollbar-thumb{background:var(--rule);border-radius:10px}
.history-item{background:var(--surface);padding:9px 12px;border:1px solid var(--rule);border-bottom-style:dashed;margin-bottom:6px;border-radius:7px;display:flex;justify-content:space-between;align-items:center;transition:box-shadow var(--tr),transform var(--tr)}
.history-item:hover{box-shadow:0 2px 8px rgba(27,43,32,.1);transform:translateX(1px)}
.item-left{border-left:3px solid #B7C9BA;padding-left:9px;min-width:0;flex:1}
.item-left.income-border{border-left-color:var(--success)}
.item-left.expense-border{border-left-color:var(--stamp)}
.item-left.transfer-border{border-left-color:var(--seal-navy)}
.item-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-faint);font-weight:600}
.item-title{font-weight:600;color:var(--ink);font-size:13px;margin:2px 0;display:flex;align-items:center;flex-wrap:wrap;gap:3px}
.item-note{font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.item-acc-tag{display:inline-flex;align-items:center;background:var(--seal-navy-wash);color:var(--seal-navy);font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700}
.item-sub-tag{display:inline-flex;align-items:center;background:var(--surface-2);color:var(--ink-faint);font-size:10px;padding:1px 5px;border-radius:4px}
.item-right{display:flex;align-items:center;gap:5px;flex-shrink:0;margin-left:8px}
.item-amount{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.highlight{background:#F6E08A;border-radius:2px;padding:0 1px}
.btn-item-action{background:none;color:var(--ink-faint);border:1px solid var(--rule);padding:2px 6px;cursor:pointer;font-size:11px;border-radius:5px;transition:all var(--tr)}
.btn-item-edit:hover{color:var(--seal-navy);border-color:var(--seal-navy);background:var(--seal-navy-wash)}
.btn-item-delete:hover{color:var(--stamp);border-color:var(--stamp);background:var(--stamp-wash)}

.modal-overlay{position:fixed;inset:0;background:rgba(20,30,22,.45);z-index:8000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border-radius:12px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;color:var(--ink-faint);border:none;font-size:20px;padding:0;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--ink)}
.modal-footer{display:flex;gap:8px;margin-top:16px}
.modal-footer button{flex:1}

.budget-item{margin-bottom:8px;background:var(--surface);padding:9px 10px;border-radius:8px;border:1px solid var(--rule)}
.budget-info{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;align-items:center}
.progress-bar-bg{background:var(--rule);border-radius:4px;height:5px;overflow:hidden;margin-bottom:2px}
.progress-bar-bg.year-bg{height:3px;margin-top:3px}
.progress-bar-fill{background:var(--seal-navy);height:100%;width:0;transition:width .4s ease}
.progress-bar-fill.year-fill{background:var(--gold)}
.progress-over{background:var(--stamp)!important}
.budget-action-btns{display:flex;gap:3px;align-items:center}
.btn-budget-edit,.btn-budget-delete{background:none;color:var(--ink-faint);border:none;padding:2px 4px;cursor:pointer;font-size:11px;border-radius:4px}
.btn-budget-edit:hover{color:var(--seal-navy);background:var(--seal-navy-wash)}
.btn-budget-delete:hover{color:var(--stamp);background:var(--stamp-wash)}
.budget-summary-box{background:var(--surface-2);border:1px dashed var(--rule);border-radius:8px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:5px}
.budget-summary-row{display:grid;grid-template-columns:80px 1fr 1fr 1fr;gap:4px;align-items:center}
.budget-summary-row.header{border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:2px}
.budget-summary-title{font-size:11px;font-weight:700;color:var(--ink-soft)}
.budget-summary-label{font-size:10px;color:var(--ink-faint);font-weight:600;text-align:center}
.budget-summary-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-align:center}

.analysis-section{background:var(--surface-2);padding:14px 16px;border-radius:10px;border:1px solid var(--rule);margin-top:16px}
.analysis-header{display:flex;justify-content:space-between;align-items:center}
.charts-wrapper{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.charts-wrapper.collapsed{display:none}
.chart-box-standalone{background:var(--surface);padding:12px 14px;border-radius:8px;border:1px solid var(--rule);height:240px;position:relative}
.chart-box-standalone h4{margin:0 0 6px;color:var(--ink-soft);font-size:11px;text-align:center;font-weight:600}
.custom-budget-zone{background:var(--seal-navy-wash);padding:10px 12px;border-radius:8px;border:1px solid #c7d3e6;margin-top:10px}
.custom-budget-zone h4{margin:0 0 8px;color:var(--seal-navy);font-size:12px;font-family:'Noto Serif TC',serif}
.custom-budget-item{border-left:3px solid var(--seal-navy)}
.backup-zone{display:flex;flex-direction:column;gap:5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:10000;transition:transform .3s ease,opacity .3s ease;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:900px){
  body{padding:10px}
  .main-layout{flex-direction:column}
  .sidebar{max-width:100%}
  .form-row{flex-direction:column;gap:8px}
  .form-row .form-group{flex:none}
  .balance-amount{font-size:26px}
  .control-row{flex-direction:column}
  .control-item{min-width:100%}
  .container,.sidebar{padding-left:24px}
}
@media(max-width:500px){
  .history-list-wrapper{max-height:300px}
  .chart-box-standalone{height:200px}
  .batch-cell{flex:1 1 100%}
  .item-note{max-width:160px}
}
</style>
</head>
<body>
<div id="cloudLoadingLock"><div class="lock-spinner"></div><div id="lockStatusText">連線中... 正在載入帳目...</div></div>
<div id="toastMsg" class="toast"></div>

<!-- 編輯模組面版 -->
<div id="editModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEditModal()">
  <div class="modal-box">
    <div class="modal-title">✏️ 編輯記帳明細 <button class="modal-close" onclick="closeEditModal()">✕</button></div>
    <input type="hidden" id="editRecordId">
    <div class="form-row" style="margin-bottom:10px">
      <div class="form-group"><label>交易類型</label>
        <select id="editType" onchange="handleEditTypeChange()">
          <option value="支出">支出 💸</option><option value="收入">收入 💰</option><option value="轉帳">轉帳 🔄</option>
        </select>
      </div>
      <div class="form-group"><label>交易日期</label><input type="date" id="editDate"></div>
    </div>
    <div class="form-group" id="editNormalAccGroup"><label>交易帳戶</label><select id="editAccount"></select></div>
    <div class="form-row" id="editTransferGroup" style="display:none;margin-bottom:10px">
      <div class="form-group"><label>轉出帳戶</label><select id="editFromAccount"></select></div>
      <div class="form-group"><label>轉入帳戶</label><select id="editToAccount"></select></div>
    </div>
    <div class="form-row" id="editCategoryRow" style="margin-bottom:10px">
      <div class="form-group"><label id="editMainCatLabel">支出大項</label><select id="editMainCategory" onchange="handleEditMainCatChange()"></select></div>
      <div class="form-group" id="editSubCategoryGroup"><label>支出小項</label><select id="editSubCategory"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>金額</label><input type="number" id="editAmount" placeholder="金額" inputmode="decimal"></div>
      <div class="form-group"><label>備註說明</label><input type="text" id="editNote" placeholder="備註"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeEditModal()">取消</button>
      <button class="btn-primary" style="margin-top:0" onclick="saveEditRecord()">儲存變更</button>
    </div>
  </div>
</div>

<div class="main-layout">
<div class="container">
  <div class="app-header">
    <div class="app-title">📒 我的智慧帳本</div>
    <div class="cloud-status-bar"><div class="sync-dot" id="cloudStatusDot"></div><span id="cloudStatusText">連接中...</span></div>
  </div>
  
  <div class="dashboard">
    <div class="balance-title">淨資產總額（資產 − 信用卡負債）</div>
    <div class="balance-amount" id="netBalance">$0</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">本期收入</div><div class="stat-value text-income">+$<span id="totalIncome">0</span></div></div>
      <div class="stat-box"><div class="stat-label">本期支出</div><div class="stat-value text-expense">−$<span id="totalExpense">0</span></div></div>
    </div>
  </div>

  <div class="section-title">批次新增記帳</div>
  <div id="batchInputContainer" class="batch-container"></div>
  <div class="batch-actions">
    <button class="btn-ghost btn-sm" onclick="addBatchRow()">➕ 增加一筆</button>
  </div>
  <button class="btn-primary" onclick="addBatchRecords()">🚀 批次新增並同步雲端</button>
  <div class="shortcut-hint">批次鍵入後，一鍵儲存即刻上傳至 Google Sheet。</div>

  <div class="analysis-section">
    <div class="analysis-header">
      <div class="section-title" style="margin-bottom:0">視覺圖表分析</div>
      <button class="btn-toggle-view" id="btnToggleCharts" onclick="toggleChartsCollapse()">📊 展開圖表</button>
    </div>
    <div class="charts-wrapper collapsed" id="chartsWrapper">
      <div class="form-row" style="margin-top:10px;margin-bottom:4px">
        <div class="form-group"><label style="font-size:11px">圖表開始日期</label><input type="date" id="analysisStartDate" onchange="updateUI()"></div>
        <div class="form-group"><label style="font-size:11px">圖表結束日期</label><input type="date" id="analysisEndDate" onchange="updateUI()"></div>
      </div>
      <div class="chart-box-standalone"><h4>各項支出比例 💸</h4><canvas id="expensePieChart"></canvas></div>
      <div class="chart-box-standalone"><h4>收入管道分配 💰</h4><canvas id="incomeBarChart"></canvas></div>
      <div class="chart-box-standalone"><h4>資產淨值走勢 📈</h4><canvas id="assetLineChart"></canvas></div>

<script>
// ═══════════════════════════════════════════
//  常數定義
// ═══════════════════════════════════════════
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwtS-XCaLW48NLfV7xsZDbgJ5ptJ_2QjoQzAiDkJCQIWZUJ6MGuf3tmoYJT2f4qmd6Y/exec";
const ACCOUNT_NAMES = ['現金','台灣銀行','newnewbank','郵局','二信','永豐','玉山信用卡','永豐信用卡','台新信用卡','富邦'];
const EXPENSE_DATA = {
  '餐飲食品':['早餐','午餐','晚餐','宵夜','飲料','點心零嘴','食材','水果'],
  '服飾美容':['衣服褲子','配件','鞋子','剪髮','保養品'],
  '居家生活':['傢俱','家電','房租','水費','電費','瓦斯費','網路費','電話費','保險費','稅務','阿曦','阿霄','訂閱支出','寶貝寵物','洗衣費用','生活用品','購屋費用'],
  '運輸交通':['計程車','高鐵','飛機','火車','船費','過路費','公車'],
  '教育學習':['文具','書籍','學貸','補習費'],
  '休閒娛樂':['電影','KTV','玩具小物','旅行遊玩','遊戲','彩券','運動健身','出國費用-日本'],
  '電子商品':['電腦及周邊','3C產品'],
  '汽機車':['油錢','停車費','保養費用','洗車費用','購車費用'],
  '醫療保健':['診所就醫','購買藥物','保健食品','健檢檢查'],
  '人情交際':['送禮','紅包','白包'],
  '理財投資':['股票','頭期貸款','房屋貸款'],
  '其他':['捐款','雜支','悠遊卡加值']
};
const INCOME_CATS = ['薪水','差旅費','利息','股票','其他'];

// ═══════════════════════════════════════════
//  雲端狀態與資料結構
// ═══════════════════════════════════════════
let records = [], budgets = {}, customGroupBudgets = {};
let accountBalances = Object.fromEntries(ACCOUNT_NAMES.map(n => [n, 0]));
let pieChart = null, barChart = null, lineChart = null;
let _lockDone = false;
let batchRowCounter = 0;
let _lastActionAt = {};

const $ = id => document.getElementById(id);
const isCreditCard = n => n.includes('信用卡');

function debounceGuard(key, ms = 600) {
  const now = Date.now();
  if (_lastActionAt[key] && now - _lastActionAt[key] < ms) return true;
  _lastActionAt[key] = now;
  return false;
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toCloudDateStr(s) {
  if (!s) return '';
  let str = String(s).trim();
  if (str.includes('T')) str = str.slice(0, 10);
  return str.replace(/-/g, '/');
}

function toInputDateStr(s) {
  if (!s) return '';
  return String(s).replace(/\//g, '-');
}

function parseDate(s) {
  const clean = toCloudDateStr(s);
  if (!clean) {
    const d = new Date(); d.setHours(12, 0, 0, 0); return d;
  }
  const p = clean.split('/');
  let d;
  if (p.length === 2) d = new Date(+p[0], +p[1]-1, 1);
  else if (p.length === 3) d = new Date(+p[0], +p[1]-1, +p[2]);
  else d = new Date();
  d.setHours(12, 0, 0, 0);
  return d;
}

function showToast(msg, ms = 2500) {
  const t = $('toastMsg');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function highlight(text, kw) {
  const safe = escHtml(text);
  if (!kw) return safe;
  const escKw = escHtml(kw).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(escKw, 'gi'), m => `<span class="highlight">${m}</span>`);
}

function makeOptions(arr, el) {
  el.innerHTML = arr.map(v => `<option value="${v}">${v}</option>`).join('');
}

function releaseLock() {
  if (_lockDone) return;
  _lockDone = true;
  $('cloudLoadingLock').style.display = 'none';
}

function setCloudStatus(msg, spinning) {
  $('cloudStatusText').textContent = msg;
  $('cloudStatusDot').className = 'sync-dot' + (spinning ? ' spinning' : '');
}

// ═══════════════════════════════════════════
//  增量同步 (Incremental Sync) API 發送模組
// ═══════════════════════════════════════════
function sendCloudAction(payload, successMsg = '已同步') {
  setCloudStatus('同步中...', true);
  return fetch(CLOUD_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(res => {
    const isOk = res && (res.status === 'success' || res.result === 'success');
    setCloudStatus(isOk ? successMsg : '❌ 失敗', false);
    return res;
  })
  .catch(err => {
    console.error('[雲端同步失敗]', err);
    setCloudStatus('⚠️ 離線', false);
  });
}

// 專用增量操作對應函數
function pushAddRecords(newRecords) {
  return sendCloudAction({
    action: 'addRecords',
    records: newRecords.map(r => ({ ...r, date: toCloudDateStr(r.date) }))
  });
}

function pushUpdateRecord(updatedRecord) {
  return sendCloudAction({
    action: 'updateRecord',
    record: { ...updatedRecord, date: toCloudDateStr(updatedRecord.date) }
  });
}

function pushDeleteRecord(id) {
  return sendCloudAction({
    action: 'deleteRecord',
    id: id
  });
}

function pushClearAllRecords() {
  return sendCloudAction({
    action: 'clearAllRecords'
  });
}

function pushAccounts() {
  return sendCloudAction({
    action: 'updateAccounts',
    accounts: ACCOUNT_NAMES.map(k => [k, accountBalances[k] || 0])
  });
}

function pushBudgets() {
  return sendCloudAction({
    action: 'updateBudgets',
    budgets: Object.entries(budgets)
  });
}

function pushCustomGroupBudgets() {
  return sendCloudAction({
    action: 'updateCustomGroupBudgets',
    customGroupBudgets: JSON.stringify(customGroupBudgets)
  });
}

// 全量備份專用（僅用於 CSV 匯入全覆蓋）
function pushFullSync() {
  return sendCloudAction({
    action: 'syncAll',
    accounts: ACCOUNT_NAMES.map(k => [k, accountBalances[k] || 0]),
    budgets: Object.entries(budgets),
    customGroupBudgets: JSON.stringify(customGroupBudgets),
    records: records.map(r => ({ ...r, date: toCloudDateStr(r.date) }))
  });
}

function fetchCloudData() {
  setCloudStatus('連線中...', true);
  const fallback = reason => {
    console.warn('[雲端連線失敗]', reason);
    setCloudStatus('載入失敗，請重新整理', false);
    releaseLock();
  };
  const timer = setTimeout(() => fallback('連線超時'), 12000);
  fetch(CLOUD_URL)
    .then(r => r.json())
    .then(res => {
      clearTimeout(timer);
      if (!res || res.status !== 'success' || !res.data) { fallback('回傳結構錯誤'); return; }
      const c = res.data;
      if (c.accounts && typeof c.accounts === 'object') accountBalances = c.accounts;
      if (c.budgets && typeof c.budgets === 'object') budgets = c.budgets;
      if (c.customGroupBudgets) {
        let cg = c.customGroupBudgets;
        if (typeof cg === 'string') { try { cg = JSON.parse(cg); } catch(e) { cg = {}; } }
        if (typeof cg === 'object') customGroupBudgets = cg;
      }
      if (Array.isArray(c.records)) {
        records = c.records;
        records.forEach(r => { r.date = toCloudDateStr(r.date); });
        records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
      }
      setCloudStatus('已同步', false);
      releaseLock();
      updateUI();
    })
    .catch(err => { clearTimeout(timer); fallback(err.message); });
}

// ═══════════════════════════════════════════
//  UI 初始化
// ═══════════════════════════════════════════
function initAccountUI() {
  $('accountGrid').innerHTML = ACCOUNT_NAMES.map(name => `
    <div class="${isCreditCard(name) ? 'account-card credit' : 'account-card asset'}">
      <span class="account-name">${name}</span>
      <span class="account-val" id="val-${name}">$0</span>

        <input type="number" id="input-${name}" placeholder="初值">
        <button onclick="updateAccountInit('${name}')">改</button>
      </div>
    </div>`).join('');
}

function initSelects() {
  ['editAccount','editFromAccount','editToAccount'].forEach(id => {
    const e = $(id); if (e) makeOptions(ACCOUNT_NAMES, e);
  });
  makeOptions(Object.keys(EXPENSE_DATA), $('budgetCategory'));
}

function initCustomGroupSubCats() {
  $('customGroupSubCats').innerHTML = Object.entries(EXPENSE_DATA).map(([main, subs]) =>
    `<optgroup label="【${main}】">${subs.map(s => `<option value="${s}">${s}</option>`).join('')}</optgroup>`
  ).join('');
}

function initMonthSelects() {
  const d = new Date();
  const opts = Array.from({length: 9}, (_, i) => {
    const target = new Date(d.getFullYear(), d.getMonth() - 6 + i, 1);
    const ms = `${target.getFullYear()}/${String(target.getMonth()+1).padStart(2,'0')}`;
    return `<option value="${ms.replace(/\//g, '-')}" ${i===6?'selected':''}>${ms}</option>`;
  }).join('');
  ['budgetMonthSelect','filterMonthSelect'].forEach(id => { $(id).innerHTML = opts; });
}

function initFilterCats() {
  const expHtml = Object.keys(EXPENSE_DATA).map(c => `<option value="${c}">${c}</option>`).join('');
  const incHtml = INCOME_CATS.map(c => `<option value="${c}">${c}</option>`).join('');
  $('filterCategorySelect').innerHTML = `<option value="ALL">全部</option>
    <optgroup label="💸 支出大項">${expHtml}</optgroup>
    <optgroup label="💰 收入管道">${incHtml}</optgroup>
    <option value="內部轉帳">🔄 內部轉帳</option>`;
}

// ═══════════════════════════════════════════
//  動態批次記帳
// ═══════════════════════════════════════════
function addBatchRow() {
  batchRowCounter++;
  const id = batchRowCounter;
  const d = new Date();
  const todayInputStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  
  const rowHtml = `
    <div class="batch-row" id="batch-row-${id}">
      <div class="batch-cell" style="flex: 1 1 90px; max-width: 100px;">
        <label>交易類型</label>
        <select id="batch-type-${id}" onchange="handleBatchTypeChange(${id})">
          <option value="支出">支出 💸</option><option value="收入">收入 💰</option><option value="轉帳">轉帳 🔄</option>
        </select>
      </div>
      <div class="batch-cell" style="flex: 1 1 125px; max-width: 135px;">
        <label>交易日期</label>
        <input type="date" id="batch-date-${id}" value="${todayInputStr}">
      </div>
      <div class="batch-cell" id="batch-acc-group-${id}" style="flex: 1 1 115px; max-width: 125px;">
        <label>交易帳戶</label><select id="batch-account-${id}"></select>
      </div>
      <div class="batch-cell" id="batch-from-group-${id}" style="flex: 1 1 110px; max-width: 120px; display:none;">
        <label>轉出帳戶</label><select id="batch-from-account-${id}"></select>
      </div>
      <div class="batch-cell" id="batch-to-group-${id}" style="flex: 1 1 110px; max-width: 120px; display:none;">
        <label>轉入帳戶</label><select id="batch-to-account-${id}"></select>
      </div>
      <div class="batch-cell" id="batch-main-cat-group-${id}" style="flex: 1 1 115px; max-width: 125px;">
        <label id="batch-main-label-${id}">支出大項</label><select id="batch-main-cat-${id}" onchange="handleBatchMainCatChange(${id})"></select>
      </div>
      <div class="batch-cell" id="batch-sub-cat-group-${id}" style="flex: 1 1 115px; max-width: 125px;">
        <label>支出小項</label><select id="batch-sub-cat-${id}"></select>
      </div>
      <div class="batch-cell" style="flex: 1 1 90px; max-width: 105px;">
        <label>金額</label><input type="number" id="batch-amount-${id}" placeholder="金額" inputmode="decimal">
      </div>
      <div class="batch-cell" style="flex: 2 1 160px;">
        <label>備註說明</label><input type="text" id="batch-note-${id}" placeholder="選填備註">
      </div>
      <button class="btn-remove-row" onclick="removeBatchRow(${id})">✕</button>
    </div>`;
  
  $('batchInputContainer').insertAdjacentHTML('beforeend', rowHtml);
  makeOptions(ACCOUNT_NAMES, $(`batch-account-${id}`));
  makeOptions(ACCOUNT_NAMES, $(`batch-from-account-${id}`));
  makeOptions(ACCOUNT_NAMES, $(`batch-to-account-${id}`));
  handleBatchTypeChange(id);
}

function removeBatchRow(id) {
  if($('batchInputContainer').children.length > 1) {
    $(`batch-row-${id}`).remove();
  } else {
    showToast('⚠️ 至少需保留一筆輸入列');
  }
}

function handleBatchTypeChange(id) {
  const type = $(`batch-type-${id}`).value;
  const isT = type === '轉帳', isI = type === '收入';
  $(`batch-acc-group-${id}`).style.display = isT ? 'none' : 'block';
  $(`batch-from-group-${id}`).style.display = isT ? 'block' : 'none';
  $(`batch-to-group-${id}`).style.display = isT ? 'block' : 'none';
  $(`batch-main-cat-group-${id}`).style.display = isT ? 'none' : 'block';
  $(`batch-sub-cat-group-${id}`).style.display = (isT || isI) ? 'none' : 'block';
  $(`batch-main-label-${id}`).textContent = isI ? '收入分類' : '支出大項';
  
  const ms = $(`batch-main-cat-${id}`); ms.innerHTML = '';
  if (!isT) {
    (isI ? INCOME_CATS : Object.keys(EXPENSE_DATA)).forEach(c => {
      const o = document.createElement('option'); o.value = o.textContent = c; ms.appendChild(o);
    });
  }
  if (!isT && !isI) handleBatchMainCatChange(id);
}

function handleBatchMainCatChange(id) {
  makeOptions(EXPENSE_DATA[$(`batch-main-cat-${id}`).value] || [], $(`batch-sub-cat-${id}`));
}

function addBatchRecords() {
  if (debounceGuard('addBatchRecords')) return;
  const rows = $('batchInputContainer').children;
  let validRecords = [];

  for (let row of rows) {
    const rowId = row.id.replace('batch-row-', '');
    const type = $(`batch-type-${rowId}`).value;
    const amount = parseInt($(`batch-amount-${rowId}`).value, 10);
    const note = $(`batch-note-${rowId}`).value.trim();
    const date = toCloudDateStr($(`batch-date-${rowId}`).value);

    if (isNaN(amount) || amount <= 0) continue;
    if (!date) { showToast('⚠️ 請確實選擇日期'); return; }

    const rec = { id: Date.now() + validRecords.length, type, amount, note: note || '無備註', date };
    if (type === '轉帳') {
      const from = $(`batch-from-account-${rowId}`).value, to = $(`batch-to-account-${rowId}`).value;
      if (from === to) { showToast('⚠️ 轉帳帳戶不能相同'); return; }
      rec.fromAccount = from; rec.toAccount = to;
    } else {
      rec.account = $(`batch-account-${rowId}`).value;
      rec.mainCategory = $(`batch-main-cat-${rowId}`).value;
      rec.subCategory = type === '支出' ? $(`batch-sub-cat-${rowId}`).value : '';
    }
    validRecords.push(rec);
  }

  if (validRecords.length === 0) {
    showToast('⚠️ 請填入有效的金額資料'); return;
  }

  records.push(...validRecords);
  records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
  
  updateUI();
  pushAddRecords(validRecords); // 僅上傳新增紀錄
  $('batchInputContainer').innerHTML = ''; addBatchRow();
  showToast(`✅ 成功同步新增 ${validRecords.length} 筆交易！`);
}

function openEditModal(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  $('editRecordId').value = r.id;
  $('editType').value    = r.type;
  $('editDate').value    = toInputDateStr(r.date);
  $('editAmount').value  = r.amount;
  $('editNote').value    = r.note === '無備註' ? '' : (r.note || '');
  syncTypeUI();
  if (r.type === '轉帳') {
    $('editFromAccount').value = r.fromAccount || '';
    $('editToAccount').value   = r.toAccount   || '';
  } else {
    $('editAccount').value = r.account || '';
    const ms = $('editMainCategory');
    [...ms.options].forEach(o => { o.selected = o.value === r.mainCategory; });
    handleEditMainCatChange();
    if (r.subCategory) { const ss = $('editSubCategory'); [...ss.options].forEach(o => { o.selected = o.value === r.subCategory; }); }
  }
  $('editModal').style.display = 'flex';
}

function closeEditModal() { $('editModal').style.display = 'none'; }
function handleEditTypeChange() { syncTypeUI(); }
function handleEditMainCatChange() { makeOptions(EXPENSE_DATA[$('editMainCategory').value] || [], $('editSubCategory')); }

function syncTypeUI() {
  const type = $('editType').value;
  const isT = type === '轉帳', isI = type === '收入';
  $('editNormalAccGroup').style.display = isT ? 'none' : 'block';
  $('editTransferGroup').style.display = isT ? 'flex' : 'none';
  $('editCategoryRow').style.display = isT ? 'none' : 'flex';
  $('editSubCategoryGroup').style.display = isI ? 'none' : 'block';
  $('editMainCatLabel').textContent = isI ? '收入分類' : '支出大項';
  const ms = $('editMainCategory'); ms.innerHTML = '';
  if (!isT) { (isI ? INCOME_CATS : Object.keys(EXPENSE_DATA)).forEach(c => { const o = document.createElement('option'); o.value = o.textContent = c; ms.appendChild(o); }); }
  if (!isT && !isI) handleEditMainCatChange();
}

function saveEditRecord() {
  if (debounceGuard('saveEditRecord')) return;
  const id  = parseInt($('editRecordId').value, 10);
  const idx = records.findIndex(x => x.id === id); if (idx === -1) return;
  const type   = $('editType').value;
  const amount = parseInt($('editAmount').value, 10);
  const note   = $('editNote').value.trim();
  const date   = toCloudDateStr($('editDate').value);
  if (!date || isNaN(amount) || amount <= 0) { showToast('⚠️ 請填入正確日期與金額'); return; }
  
  const updated = { id, type, amount, note: note || '無備註', date };
  if (type === '轉帳') {
    const from = $('editFromAccount').value, to = $('editToAccount').value;
    if (from === to) { showToast('⚠️ 轉帳帳戶不能相同'); return; }
    updated.fromAccount = from; updated.toAccount = to;
  } else {
    updated.account      = $('editAccount').value;
    updated.mainCategory = $('editMainCategory').value;
    updated.subCategory  = type === '支出' ? $('editSubCategory').value : '';
  }
  records[idx] = updated;
  records.sort((a, b) => parseDate(b.date) - parseDate(a.date));
  updateUI();
  pushUpdateRecord(updated); // 僅上傳該筆更新
  closeEditModal();
  showToast('✅ 已更新異動');
}

function deleteRecord(id) {
  if (!confirm('確定刪除這筆記錄？')) return;
  records = records.filter(r => r.id !== id);
  updateUI();
  pushDeleteRecord(id); // 僅上傳刪除 ID
  showToast('🗑️ 已刪除明細');
}

function clearAllRecords() {
  if (!confirm('確定清空全部明細？此操作將覆蓋雲端！')) return;
  records = [];
  updateUI();
  pushClearAllRecords();
}

function saveBudget() {

function saveCustomGroupBudget() {
  const name = $('customGroupName').value.trim();

function editBudgetAmount(cat, old) {

  const n = parseInt(s, 10); if (isNaN(n) || n < 0) return;

}
function editCustomGroupAmount(name, old) {

  const n = parseInt(s, 10); if (isNaN(n) || n < 0) return;
  customGroupBudgets[name].limit = n; updateUI(); pushCustomGroupBudgets();
}
function deleteBudget(cat) { if (confirm(`刪除「${cat}」預算？`)) { delete budgets[cat]; updateUI(); pushBudgets(); } }
function deleteCustomGroupBudget(name) { if (confirm(`刪除自訂群組「${name}」？`)) { delete customGroupBudgets[name]; updateUI(); pushCustomGroupBudgets(); } }

// ═══════════════════════════════════════════
//  CSV 匯出/匯入
// ═══════════════════════════════════════════
function exportToCSV() {
  let csv = "=== 系統帳戶初始設定配額 ===\n帳戶名稱,初始金額\n";
  ACCOUNT_NAMES.forEach(n => { csv += `${n},${accountBalances[n]}\n`; });
  csv += "=== 明細流水帳紀錄開始 ===\n交易日期,交易類型,主分類/大項,子分類/小項,交易帳戶/細節,金額,備註說明\n";
  records.forEach(r => {
    let row = [toCloudDateStr(r.date), r.type];
    if (r.type === '轉帳') row.push('內部轉帳', '-', `從 [${r.fromAccount}] 轉到 [${r.toAccount}]`);
    else row.push(r.mainCategory||'', r.subCategory||'-', r.account||'');
    row.push(r.amount, String(r.note||'').replace(/,/g,' '));
    csv += row.join(',') + "\n";
  });
  const d = new Date();
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'})),
    download: `智慧記帳本_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.csv`
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function triggerCSVImport() { $('importCSVFileInput').click(); }
function importFromCSV(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split('\n');
      let imported = [], parsedAcc = {...accountBalances}, readingRecs = false;
      lines.forEach((line, i) => {
        line = line.trim(); if (!line) return;
        if (line.includes('=== 明細流水帳紀錄開始 ===')) { readingRecs = true; return; }
        if (!readingRecs) {
          const p = line.split(',');
          if (p.length === 2 && ACCOUNT_NAMES.includes(p[0].trim())) parsedAcc[p[0].trim()] = parseInt(p[1].trim(), 10) || 0;
        } else {
          const c = line.split(','); if (c.length < 6) return;
          const item = { id: Date.now()+i, date: toCloudDateStr(c[0].trim()), type: c[1].trim(), amount: parseInt(c[5].trim(), 10)||0, note: c[6]?c[6].trim():'無備註' };
          if (item.type === '轉帳') { const m = c[4].trim().match(/從 \[(.*?)\] 轉到 \[(.*?)\]/); if (m) { item.fromAccount = m[1]; item.toAccount = m[2]; } }
          else { item.mainCategory = c[2].trim(); item.subCategory = c[3].trim()==='-'?'':c[3].trim(); item.account = c[4].trim(); }
          imported.push(item);
        }
      });
      if (!confirm(`確認匯入 ${imported.length} 筆資料並蓋寫雲端？`)) return;
      accountBalances = parsedAcc;
      records = imported.sort((a, b) => parseDate(b.date) - parseDate(a.date));
      updateUI();
      pushFullSync(); // 批次 CSV 匯入全覆蓋
      showToast(`✅ 成功匯入 ${imported.length} 筆`);
    } catch(err) { showToast('❌ 匯入失敗：' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
}

// ═══════════════════════════════════════════
//  主要數據計算與畫面渲染核心
// ═══════════════════════════════════════════
function updateUI() {
  const selBudgetMonth = toCloudDateStr($('budgetMonthSelect').value).slice(0, 7);
  const bDate = parseDate(selBudgetMonth + "/01");
  const bYear = bDate.getFullYear(), bMon = bDate.getMonth() + 1;
  
  const chartStart = parseDate($('analysisStartDate').value);
  const chartEnd   = parseDate($('analysisEndDate').value);
  const filterMode  = $('filterTimeMode').value;
  const filterMonth = toCloudDateStr($('filterMonthSelect').value).slice(0, 7);
  const filterStart = parseDate($('filterStartDate').value);
  const filterEnd   = parseDate($('filterEndDate').value);
  const filterCat   = $('filterCategorySelect').value;
  const kwLow = $('searchKeyword').value.trim().toLowerCase();

  const balances     = {...accountBalances};
  const expChart     = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const incChart     = Object.fromEntries(INCOME_CATS.map(k => [k, 0]));
  const monBudSpent  = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const yearBudSpent = Object.fromEntries(Object.keys(EXPENSE_DATA).map(k => [k, 0]));
  const grpMonSpent  = Object.fromEntries(Object.keys(customGroupBudgets).map(k => [k, 0]));
  const grpYrSpent   = Object.fromEntries(Object.keys(customGroupBudgets).map(k => [k, 0]));
  const assetLine    = {};
  let totalInc = 0, totalExp = 0;

  [...records].reverse().forEach(r => {
    r.date = toCloudDateStr(r.date);
    const rDate = parseDate(r.date);
    const rYM   = r.date.slice(0, 7); 
    const rYear = parseInt(r.date.slice(0, 4), 10);
    const rMon  = parseInt(r.date.slice(5, 7), 10);

    if (r.type === '轉帳') {
      if (balances[r.fromAccount] !== undefined) {
        if (isCreditCard(r.fromAccount)) balances[r.fromAccount] += r.amount;
        else balances[r.fromAccount] -= r.amount;
      }
      if (balances[r.toAccount] !== undefined) {
        if (isCreditCard(r.toAccount)) {
          balances[r.toAccount] -= r.amount; 
        } else {
          balances[r.toAccount] += r.amount;
        }
      }
    } else if (r.type === '收入') {
      totalInc += r.amount;
      if (balances[r.account] !== undefined) {
        if (isCreditCard(r.account)) balances[r.account] -= r.amount;
        else balances[r.account] += r.amount;
      }
      if (rDate >= chartStart && rDate <= chartEnd && incChart[r.mainCategory] !== undefined)
        incChart[r.mainCategory] += r.amount;
    } else {
      totalExp += r.amount;
      if (balances[r.account] !== undefined) {
        if (isCreditCard(r.account)) balances[r.account] += r.amount;
        else balances[r.account] -= r.amount;
      }
      if (rYM === selBudgetMonth) {
        if (monBudSpent[r.mainCategory] !== undefined) monBudSpent[r.mainCategory] += r.amount;
        Object.entries(customGroupBudgets).forEach(([g, cfg]) => { if (cfg.subCats?.includes(r.subCategory)) grpMonSpent[g] = (grpMonSpent[g]||0) + r.amount; });
      }
      if (rYear === bYear && rMon <= bMon) {
        if (yearBudSpent[r.mainCategory] !== undefined) yearBudSpent[r.mainCategory] += r.amount;
        Object.entries(customGroupBudgets).forEach(([g, cfg]) => { if (cfg.subCats?.includes(r.subCategory)) grpYrSpent[g] = (grpYrSpent[g]||0) + r.amount; });
      }
      if (rDate >= chartStart && rDate <= chartEnd && expChart[r.mainCategory] !== undefined)
        expChart[r.mainCategory] += r.amount;
    }
    
    let tA = 0, tL = 0;
    ACCOUNT_NAMES.forEach(n => isCreditCard(n) ? tL += (balances[n]||0) : tA += (balances[n]||0));
    assetLine[r.date] = tA - tL;
  });

  $('totalIncome').textContent  = totalInc.toLocaleString();
  $('totalExpense').textContent = totalExp.toLocaleString();
  let totA = 0, totL = 0;
  ACCOUNT_NAMES.forEach(n => {
    const v = balances[n] || 0, ve = $(`val-${n}`);
    if (isCreditCard(n)) {
      ve.textContent = v > 0 ? `欠 $${v.toLocaleString()}` : '$0';
      ve.style.color = v > 0 ? 'var(--danger)' : 'var(--ink-faint)';
      totL += v;
    } else {
      ve.textContent = `$${v.toLocaleString()}`;
      ve.style.color = v < 0 ? 'var(--danger)' : 'var(--ink)';
      totA += v;
    }
  });
  const net = totA - totL, netEl = $('netBalance');
  netEl.textContent = `$${net.toLocaleString()}`;
  netEl.style.color = net < 0 ? '#fca5a5' : 'white';

  let html = '', count = 0;
  records.forEach(r => {
    const rDate = parseDate(r.date);
    const passTime = filterMode === 'month' ? r.date.slice(0,7) === filterMonth : rDate >= filterStart && rDate <= filterEnd;
    const passCat  = filterCat === 'ALL' ? true : filterCat === '內部轉帳' ? r.type === '轉帳' : r.type !== '轉帳' && r.mainCategory === filterCat;
    
    let passKw = true;
    if (kwLow) {
      if (r.type === '轉帳') {
        passKw = [r.note, '轉帳', r.fromAccount, r.toAccount].some(f => String(f || '').toLowerCase().includes(kwLow));
      } else {
        passKw = [r.note, r.mainCategory, r.subCategory, r.account].some(f => String(f || '').toLowerCase().includes(kwLow));
      }
    }

    if (!passTime || !passCat || !passKw) return;
    count++;

    const noteHl = highlight(r.note || '', $('searchKeyword').value);
    const actions = `<button class="btn-item-action btn-item-edit" onclick="openEditModal(${r.id})">✏️</button>
                     <button class="btn-item-action btn-item-delete" onclick="deleteRecord(${r.id})">✕</button>`;

    if (r.type === '轉帳') {
      html += `<div class="history-item">
        <div class="item-left transfer-border">
          <div class="item-date">${r.date}</div>
          <div class="item-title"><span class="item-acc-tag">🔄 轉帳</span> ${highlight(r.fromAccount, $('searchKeyword').value)} → ${highlight(r.toAccount, $('searchKeyword').value)}</div>
          <div class="item-note">${noteHl}</div>
        </div>
        <div class="item-right"><div class="item-amount" style="color:var(--seal-navy)">$${r.amount.toLocaleString()}</div>${actions}</div>
      </div>`;
    } else {
      const isInc = r.type === '收入';
      html += `<div class="history-item">
        <div class="item-left ${isInc ? 'income-border' : 'expense-border'}">
          <div class="item-date">${r.date}</div>
          <div class="item-title"><span class="item-acc-tag">${escHtml(r.account)}</span> ${highlight(r.mainCategory, $('searchKeyword').value)}${!isInc && r.subCategory ? `<span class="item-sub-tag">${highlight(r.subCategory, $('searchKeyword').value)}</span>` : ''}</div>
          <div class="item-note">${noteHl}</div>
        </div>
        <div class="item-right"><div class="item-amount" style="color:${isInc?'var(--success)':'var(--danger)'}">${isInc?'+':'−'}$${r.amount.toLocaleString()}</div>${actions}</div>
      </div>`;
    }
  });

  $('searchCount').textContent = kwLow ? `找到 ${count} 筆符合條件記錄` : (count > 0 ? `共 ${count} 筆` : '');
  $('recordList').innerHTML = count === 0 ? `<p style="text-align:center;color:var(--ink-faint);padding:20px 0">此期間查無記帳明細</p>` : html;

  const budgetEl = $('budgetListSection'); budgetEl.innerHTML = '';
  let hasAny = false, sumB = 0, sumS = 0, sumYB = 0, sumYS = 0;

  for (const cat in budgets) {
    hasAny = true;
    const limit = budgets[cat], spent = monBudSpent[cat]||0, rem = limit - spent;
    const yLimit = limit * bMon, ySpent = yearBudSpent[cat]||0;
    sumB += limit; sumS += spent; sumYB += yLimit; sumYS += ySpent;
    const pct = limit > 0 ? Math.min((spent/limit)*100, 100) : 0, over = spent > limit;
    budgetEl.insertAdjacentHTML('beforeend', `<div class="budget-item">
      <div class="budget-info"><span>🏷️ <strong>${cat}</strong></span>
        <div class="budget-action-btns">
          <span style="color:${over?'var(--danger)':'var(--success)'};font-weight:700;font-size:11px">${over?'超 $'+Math.abs(rem).toLocaleString():'餘 $'+rem.toLocaleString()}</span>
          <button class="btn-budget-edit" onclick="editBudgetAmount('${cat}',${limit})">✏️</button>
          <button class="btn-budget-delete" onclick="deleteBudget('${cat}')">✕</button>
        </div>
      </div>
      <div style="color:var(--ink-faint);font-size:10px;margin-bottom:3px">已花 $${spent.toLocaleString()} / 預算 $${limit.toLocaleString()}</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill${over?' progress-over':''}" style="width:${pct}%"></div></div>
    </div>`);
  }

  for (const gn in customGroupBudgets) {
    hasAny = true;
    const g = customGroupBudgets[gn], limit = g.limit, spent = grpMonSpent[gn]||0, rem = limit - spent;
    const yLimit = limit * bMon, ySpent = grpYrSpent[gn]||0;
    sumB += limit; sumS += spent; sumYB += yLimit; sumYS += ySpent;
    const pct = limit > 0 ? Math.min((spent/limit)*100, 100) : 0;
    const yPct = yLimit > 0 ? Math.min((ySpent/yLimit)*100, 100) : 0;
    const over = spent > limit, yOver = ySpent > yLimit;
    budgetEl.insertAdjacentHTML('beforeend', `<div class="budget-item custom-budget-item">
      <div class="budget-info"><span style="color:var(--seal-navy)">🧩 <strong>${gn}</strong></span>
        <div class="budget-action-btns">
          <span style="color:${over?'var(--danger)':'var(--success)'};font-weight:700;font-size:11px">${over?'超 $'+Math.abs(rem).toLocaleString():'餘 $'+rem.toLocaleString()}</span>
          <button class="btn-budget-edit" onclick="editCustomGroupAmount('${gn}',${limit})">✏️</button>
          <button class="btn-budget-delete" onclick="deleteCustomGroupBudget('${gn}')">✕</button>
        </div>
      </div>
      <div style="color:var(--ink-soft);font-size:10px;margin-bottom:2px">包含: ${g.subCats?g.subCats.join(', '):''}</div>
      <div style="color:var(--ink-faint);font-size:10px">當月 $${spent.toLocaleString()} / $${limit.toLocaleString()}</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill${over?' progress-over':''}" style="width:${pct}%"></div></div>
      <div style="color:var(--ink-faint);font-size:10px;margin-top:3px">年度 $${ySpent.toLocaleString()} / $${yLimit.toLocaleString()}</div>
      <div class="progress-bar-bg year-bg"><div class="progress-bar-fill year-fill${yOver?' progress-over':''}" style="width:${yPct}%"></div></div>
    </div>`);
  }

  const bs = $('budgetSummaryBox');
  if (hasAny) {
    bs.style.display = 'flex';
    $('sumTotalBudget').textContent = `$${sumB.toLocaleString()}`;
    $('sumTotalSpent').textContent  = `$${sumS.toLocaleString()}`;
    const tr = sumB - sumS;
    $('sumTotalRemaining').textContent = tr >= 0 ? `$${tr.toLocaleString()}` : `超 $${Math.abs(tr).toLocaleString()}`;
    $('sumTotalRemaining').style.color = tr >= 0 ? 'var(--success)' : 'var(--danger)';
    $('yearTotalBudget').textContent = `$${sumYB.toLocaleString()}`;
    $('yearTotalSpent').textContent  = `$${sumYS.toLocaleString()}`;
    const yr = sumYB - sumYS;
    $('yearTotalRemaining').textContent = yr >= 0 ? `$${yr.toLocaleString()}` : `超 $${Math.abs(yr).toLocaleString()}`;
    $('yearTotalRemaining').style.color = yr >= 0 ? 'var(--success)' : 'var(--danger)';
  } else {
    bs.style.display = 'none';
    budgetEl.innerHTML = `<p style="color:var(--ink-faint);text-align:center;font-size:12px">尚未設定任何控管預算</p>`;
  }

  if (!$('chartsWrapper').classList.contains('collapsed'))
    renderCharts(chartStart, chartEnd, expChart, incChart, assetLine);
}

// ═══════════════════════════════════════════
//  圖表模組
// ═══════════════════════════════════════════
function renderCharts(start, end, expMap, incMap, assetLine) {
  const totalExp = Object.values(expMap).reduce((a,b)=>a+b,0);
  const expLabels = Object.keys(expMap).filter(k=>expMap[k]>0).map(k=>`${k} ($${expMap[k].toLocaleString()})`);
  const expVals   = Object.keys(expMap).filter(k=>expMap[k]>0).map(k=>expMap[k]);
  if (pieChart) pieChart.destroy();
  pieChart = new Chart($('expensePieChart').getContext('2d'), {
    type: 'doughnut',
    data: { labels: expLabels, datasets: [{ data: expVals, backgroundColor: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#1abc9c','#e67e22','#34495e','#95a5a6','#d35400','#c0392b','#7f8c8d'], borderWidth: 1 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 9, font: { size: 9 } } } } },
    plugins: [{ id: 'cp', beforeDraw(chart) {
      const ctx = chart.ctx, cx = (chart.chartArea.left+chart.chartArea.right)/2, cy = (chart.chartArea.top+chart.chartArea.bottom)/2;
      ctx.restore(); ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#718096'; ctx.textBaseline = 'middle';
      ctx.fillText('總支出', cx - ctx.measureText('總支出').width/2, cy-9); ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#e74c3c';
      const t = `$${totalExp.toLocaleString()}`; ctx.fillText(t, cx - ctx.measureText(t).width/2, cy+9); ctx.save();
    }}]
  });

  const incLabels = Object.keys(incMap).filter(k=>incMap[k]>0), incVals = incLabels.map(k=>incMap[k]);
  if (barChart) barChart.destroy();
  barChart = new Chart($('incomeBarChart').getContext('2d'), {
    type: 'bar',
    data: { labels: incLabels, datasets: [{ label: '進帳', data: incVals, backgroundColor: '#2f9e44', borderRadius: 5 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  let tlMap = {}; let cur = new Date(start);
  while (cur <= end) {
    const s = `${cur.getFullYear()}/${String(cur.getMonth()+1).padStart(2,'0')}/${String(cur.getDate()).padStart(2,'0')}`;
    tlMap[s] = 0; cur.setDate(cur.getDate()+1);
  }
  Object.keys(tlMap).forEach(d => {
    if (assetLine[d] !== undefined) { tlMap[d] = assetLine[d]; return; }
    let fb = 0; Object.keys(assetLine).forEach(t => { if (parseDate(t) <= parseDate(d)) fb = assetLine[t]; });
    tlMap[d] = fb;
  });
  const ll = Object.keys(tlMap).sort(), lv = ll.map(d=>tlMap[d]);
  if (lineChart) lineChart.destroy();
  lineChart = new Chart($('assetLineChart').getContext('2d'), {
    type: 'line',
    data: { labels: ll, datasets: [{ label: '資產淨值', data: lv, borderColor: '#3b5bdb', backgroundColor: 'rgba(59,91,219,.05)', tension: 0.2, fill: true, borderWidth: 2, pointRadius: 1 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

// ═══════════════════════════════════════════
//  網頁起始觸發
// ═══════════════════════════════════════════
(function init() {
  const d = new Date();
  const yr = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0');
  const initStart = `${yr}-${mo}-01`, initToday = `${yr}-${mo}-${String(d.getDate()).padStart(2,'0')}`;
  
  $('analysisStartDate').value = initStart; $('analysisEndDate').value = initToday;
  $('filterStartDate').value   = initStart; $('filterEndDate').value   = initToday;

  initAccountUI();
  initSelects();
  initMonthSelects();
  initFilterCats();
  initCustomGroupSubCats();
  addBatchRow();

  let _searchDebounce;
  $('searchKeyword').addEventListener('input', () => {
    clearTimeout(_searchDebounce); _searchDebounce = setTimeout(updateUI, 250);
  });

  fetchCloudData();
})();
</script>

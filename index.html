<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的智慧帳本 v12.3 穩定修復版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1450px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            flex: 1.3;
        }
        .sidebar {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            flex: 0.7;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        h2, h3 { margin-top: 0; color: #2d3748; }
        h2 { text-align: center; }
        
        /* 雲端同步狀態條 */
        .cloud-status-bar {
            background-color: #e8f4fd;
            border: 1px solid #bee3f8;
            color: #2b6cb0;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sync-loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #2b6cb0;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 資訊看板區 */
        .dashboard {
            background-color: #17252a;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .balance-title { font-size: 14px; color: #a8b2b7; text-align: center; }
        .balance-amount { font-size: 32px; font-weight: bold; text-align: center; margin: 5px 0 15px 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid #2b3a42; padding-top: 12px; }
        .dashboard .stat-box { text-align: center; }
        .stat-label { font-size: 12px; color: #a8b2b7; }
        .stat-value { font-size: 16px; font-weight: bold; margin-top: 3px; }
        .text-income { color: #2ecc71; }
        .text-expense { color: #e74c3c; }

        /* 帳戶清單樣式 */
        .account-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .account-card { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; }
        .account-name { font-size: 13px; font-weight: bold; color: #4a5568; }
        .account-val { font-size: 15px; font-weight: bold; margin-top: 4px; }
        .account-card.credit { border-left: 4px solid #e74c3c; }
        .account-card.asset { border-left: 4px solid #2ecc71; }
        .account-input-group { display: flex; gap: 5px; margin-top: 5px; }
        .account-input-group input { padding: 5px; font-size: 11px; width: 65px; height: 24px; box-sizing: border-box; }

        /* 表單樣式 */
        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }
        label { display: block; margin-bottom: 5px; color: #4a4a4a; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccd1d9; border-radius: 8px; font-size: 15px; background-color: #f8f9fa;
        }
        input:focus, select:focus { border-color: #3498db; outline: none; background-color: white; }
        
        /* 按鈕 */
        button { padding: 8px 12px; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-add { background-color: #3498db; width: 100%; padding: 12px; margin-bottom: 10px; font-size: 16px; }
        .btn-add:hover { background-color: #2980b9; }
        .btn-clear { background-color: #95a5a6; font-size: 12px; padding: 4px 8px; }
        .btn-save { background-color: #2ecc71; font-size: 12px; padding: 4px 8px; }
        .btn-backup { font-size: 12px; width: 100%; margin-bottom: 8px;}

        /* 明細列表 */
        .history { margin-top: 25px; background: #fff; border: 1px solid #edf2f7; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #edf2f7; padding-bottom: 12px; margin-bottom: 15px; }
        .history-controls { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; }
        .control-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .control-item { flex: 1; min-width: 160px; }
        .control-item label { font-size: 12px; color: #718096; margin-bottom: 3px; }
        .control-item select, .control-item input { padding: 6px 10px; font-size: 13px; border-radius: 6px; }
        
        .btn-toggle-view { background-color: #4a5568; font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .btn-toggle-view:hover { background-color: #2d3748; }
        .history-list-wrapper { display: block; max-height: 500px; overflow-y: auto; padding-right: 5px; }
        .history-list-wrapper.collapsed { display: none; }

        .history-item {
            background: white; padding: 10px 15px; border: 1px solid #e2e8f0; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .item-left { border-left: 5px solid #ccc; padding-left: 10px; }
        .item-left.income-border { border-left-color: #2ecc71; }
        .item-left.expense-border { border-left-color: #e74c3c; }
        .item-left.transfer-border { border-left-color: #9b59b6; }
        
        .item-date { font-size: 12px; color: #4a5568; font-weight: bold; margin-bottom: 2px; }
        .item-title { font-weight: bold; color: #2d3748; }
        .item-note { font-size: 13px; color: #718096; margin-top: 2px; }
        .item-acc-tag { display: inline-block; background: #e2e8f0; color: #4a5568; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
        .item-sub-tag { display: inline-block; background: #edf2f7; color: #718096; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        
        .item-right { display: flex; align-items: center; gap: 15px; }
        .item-amount { font-weight: bold; font-size: 16px; }
        .btn-delete { background: none; color: #a0aec0; border: none; padding: 5px; cursor: pointer; font-size: 14px; }
        .btn-delete:hover { color: #e74c3c; }

        /* 預算進度條 */
        .budget-section { border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .budget-item { margin-bottom: 12px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #edf2f7; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .budget-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; align-items: center; }
        .progress-bar-bg { background-color: #edf2f7; border-radius: 10px; height: 8px; width: 100%; overflow: hidden; }
        .progress-bar-fill { background-color: #3498db; height: 100%; width: 0%; transition: width 0.3s; }
        .progress-over { background-color: #e74c3c !important; }
        .btn-budget-delete { background: none; color: #a0aec0; border: none; padding: 2px 5px; cursor: pointer; font-size: 12px; }
        .btn-budget-delete:hover { color: #e74c3c; }
        
        /* 工具區 */
        .backup-zone { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 5px; }

        /* 📊 高級三圖表整合區 */
        .analysis-section { background-color: #f8f9fa; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 25px; }
        .charts-wrapper { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }
        .chart-box-standalone { background: white; padding: 18px; border-radius: 8px; border: 1px solid #e2e8f0; height: 320px; position: relative; }
        .chart-box-standalone h4 { margin: 0 0 10px 0; color: #4a5568; font-size: 14px; text-align: center; }

        /* 🌟 自訂預算群組區樣式 */
        .custom-budget-zone { background: #f0f7ff; padding: 15px; border-radius: 10px; border: 1px solid #bee3f8; margin-top: 15px; }
        .custom-budget-item { border-left: 4px solid #3182ce; background: #fff; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="container">
        <h2>我的多帳戶智慧帳本 v12.3 穩定修復版 雲端特仕版 ☁️</h2>
        
        <div class="cloud-status-bar" id="cloudStatusBar">
            <span id="cloudStatusText">正在從 Google 試算表同步雲端帳目...</span>
            <div class="sync-loading-spinner" id="cloudStatusSpinner"></div>
        </div>

        <div class="dashboard">
            <div class="balance-title">淨資產總額 (資產 - 信用卡負債)</div>
            <div class="balance-amount" id="netBalance">$0</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">本期累積收入</div>
                    <div class="stat-value text-income">+$<span id="totalIncome">0</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">本期累積支出</div>
                    <div class="stat-value text-expense">-$<span id="totalExpense">0</span></div>
                </div>
            </div>
        </div>
        
        <div class="form-row" style="margin-bottom: 12px;">
            <div class="form-group" style="flex: 0.6;">
                <label for="type">交易類型</label>
                <select id="type" onchange="handleTypeChange()">
                    <option value="支出">支出 💸</option>
                    <option value="收入">收入 💰</option>
                    <option value="轉帳">內部轉帳 🔄</option>
                </select>
            </div>
            <div class="form-group" id="normalAccountGroup">
                <label for="accountSelect" id="accLabel">交易帳戶</label>
                <select id="accountSelect"></select>
            </div>
            <div class="form-group" style="flex: 0.9;">
                <label for="recordDate">交易日期 📅</label>
                <input type="date" id="recordDate">
            </div>
        </div>

        <div class="form-row" id="transferGroup" style="display: none; margin-bottom: 12px;">
            <div class="form-group">
                <label for="fromAccountSelect">轉出帳戶 ➖</label>
                <select id="fromAccountSelect"></select>
            </div>
            <div class="form-group">
                <label for="toAccountSelect">轉入帳戶 ➕</label>
                <select id="toAccountSelect"></select>
            </div>
        </div>

        <div class="form-row" id="categoryRow" style="margin-bottom: 12px;">
            <div class="form-group">
                <label for="mainCategory" id="mainCatLabel">支出大項</label>
                <select id="mainCategory" onchange="handleMainCategoryChange()"></select>
            </div>
            <div class="form-group" id="subCategoryGroup">
                <label for="subCategory">支出小項</label>
                <select id="subCategory"></select>
            </div>
        </div>

        <div class="form-row" style="margin-bottom: 12px;">
            <div class="form-group">
                <label for="amount">金額</label>
                <input type="number" id="amount" placeholder="請輸入金額">
            </div>
            <div class="form-group">
                <label for="note">備註說明</label>
                <input type="text" id="note" placeholder="選填">
            </div>
        </div>

        <button class="btn-add" id="btnAddRecordBtn" onclick="addRecord()">新增此筆紀錄</button>

        <div class="analysis-section">
            <h3>🎛️ 進階獨立視覺圖表大面板</h3>
            
            <div class="form-row" style="margin-bottom: 15px;">
                <div class="form-group">
                    <label style="font-size:12px;">圖表篩選開始日期</label>
                    <input type="date" id="analysisStartDate" onchange="updateUI()">
                </div>
                <div class="form-group">
                    <label style="font-size:12px;">圖表篩選結束日期</label>
                    <input type="date" id="analysisEndDate" onchange="updateUI()">
                </div>
            </div>

            <div class="charts-wrapper">
                <div class="chart-box-standalone">
                    <h4>圖表一：期間內各項支出比例分佈 (含細項與中央加總) 💸</h4>
                    <canvas id="expensePieChart"></canvas>
                </div>
                <div class="chart-box-standalone">
                    <h4>圖表二：期間內收入管道進帳分配 💰</h4>
                    <canvas id="incomeBarChart"></canvas>
                </div>
                <div class="chart-box-standalone">
                    <h4>圖表三：專屬資產淨值走勢波動 📈</h4>
                    <canvas id="assetLineChart"></canvas>
                </div>
            </div>
        </div>

        <div class="history">
            <div class="history-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <h3>歷史明細</h3>
                    <button class="btn-toggle-view" id="btnToggleCollapse" onclick="toggleHistoryCollapse()">📂 收合明細</button>
                </div>
                <button class="btn-clear" onclick="clearAllRecords()">清空明細</button>
            </div>

            <div class="history-controls">
                <div class="control-row">
                    <div class="control-item" style="flex: 0.5; min-width: 100px;">
                        <label>時間過濾模式</label>
                        <select id="filterTimeMode" onchange="handleTimeModeChange()">
                            <option value="month">按月份查 📅</option>
                            <option value="days">按自訂天數 🔍</option>
                        </select>
                    </div>

                    <div class="control-item" id="filterMonthGroup">
                        <label>選擇指定月份</label>
                        <select id="filterMonthSelect" onchange="updateUI()"></select>
                    </div>

                    <div class="control-item" id="filterDaysGroup" style="display:none; flex: 1.5;">
                        <div style="display:flex; gap:5px; align-items:center;">
                            <div>
                                <label>開始天數</label>
                                <input type="date" id="filterStartDate" onchange="updateUI()">
                            </div>
                            <div style="margin-top:18px; color:#718096;">至</div>
                            <div>
                                <label>結束天數</label>
                                <input type="date" id="filterEndDate" onchange="updateUI()">
                            </div>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>篩選特定大項/分類</label>
                        <select id="filterCategorySelect" onchange="updateUI()">
                            <option value="ALL">✨ 顯示全部大項</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="history-list-wrapper" id="historyListWrapper">
                <div id="recordList"></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div>
            <h3>資料備份與 Excel 雙向同步 💾</h3>
            <div class="backup-zone">
                <button class="btn-backup" style="background-color: #27ae60;" onclick="exportToCSV()">📊 匯出完全同步表格 (CSV)</button>
                <button class="btn-backup" style="background-color: #2c3e50;" onclick="triggerCSVImport()">📥 匯入完全同步表格 (CSV)</button>
                <input type="file" id="importCSVFileInput" accept=".csv" style="display: none;" onchange="importFromCSV(event)">
            </div>
        </div>

        <div>
            <h3>帳戶資產管理 🏦</h3>
            <div class="account-grid" id="accountGrid"></div>
        </div>

        <div class="budget-section">
            <h3>🎯 智慧型月度預算控管</h3>
            
            <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 12px;">
                <label for="budgetMonthSelect" style="font-size:12px;">切換預算控管月份</label>
                <select id="budgetMonthSelect" onchange="updateUI()" style="padding:5px; font-size:13px; margin-bottom:10px;"></select>

                <label for="budgetCategory" style="font-size:12px;">1. 選擇傳統單一大項預算</label>
                <select id="budgetCategory" style="margin-bottom: 5px; padding:5px; font-size:13px;"></select>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="budgetAmountInput" placeholder="設定金額" style="padding:5px; font-size:13px;">
                    <button class="btn-save" onclick="saveBudget()">設定</button>
                </div>
            </div>

            <div class="custom-budget-zone">
                <h4 style="margin: 0 0 5px 0; color: #2b6cb0;">🧩 2. 建立自訂小項預算群組</h4>
                <div class="form-group">
                    <label style="font-size:11px; color:#4a5568;">群組名稱（如：餐食大項）</label>
                    <input type="text" id="customGroupName" placeholder="請輸入群組自訂名稱" style="padding:5px; font-size:12px; margin-bottom:5px;">
                </div>
                <div class="form-group">
                    <label style="font-size:11px; color:#4a5568;">挑選內含小項 (按住 Ctrl/Cmd 可多選)</label>
                    <select id="customGroupSubCats" multiple style="height: 100px; font-size: 11px; padding:4px;" class="form-group">
                    </select>
                </div>
                <div class="form-group">
                    <label style="font-size:11px; color:#4a5568;">設定此群組每月預算上限</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="customGroupAmount" placeholder="預算金額" style="padding:5px; font-size:12px;">
                        <button class="btn-save" style="background-color:#3182ce;" onclick="saveCustomGroupBudget()">建立控管</button>
                    </div>
                </div>
            </div>
            
            <h4 style="margin: 15px 0 8px 0; color:#4a5568;">📋 當月預算實時進度看板</h4>
            <div id="budgetListSection"></div>
        </div>
    </div>
</div>

<script>
    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbw244T5q8n0D2WDHFMUVv0PjnaPGGZu6949HVwNiZeRWnkImpra3r_dZ8zhjSynmO7YFg/exec";

    let records = [];
    let budgets = {}; 
    let customGroupBudgets = {}; 
    
    const accountNames = ['現金', '台灣銀行', 'newnewbank', '郵局', '二信', '永豐', '玉山信用卡', '永豐信用卡', '台新信用卡', '富邦'];
    let accountBalances = {
        '現金': 0, '台灣銀行': 0, 'newnewbank': 0, '郵局': 0, '二信': 0, '永豐': 0, '玉山信用卡': 0, '永豐信用卡': 0, '台新信用卡': 0, '富邦': 0
    };

    const expenseData = {
        '餐飲食品': ['早餐', '午餐', '晚餐', '宵夜', '飲料', '點心零嘴', '食材', '水果'],
        '服飾美容': ['衣服褲子', '配件', '鞋子', '剪髮', '保養品'],
        '居家生活': ['傢俱', '家電', '房租', '水費', '電費', '瓦斯費', '網路費', '電話費', '保險費', '稅務', '阿曦', '阿雷', '訂閱支出', '寶貝寵物', '洗衣費用', '生活用品', '購屋費用'],
        '運輸交通': ['計程車', '高鐵', '飛機', '火車', '船費', '過路費', '公車'],
        '教育學習': ['文具', '書籍', '學貸', '補習費'],
        '休閒娛樂': ['電影', 'KTV', '玩具小物', '旅行遊玩', '遊戲', '彩券', '運動健身', '出國費用-日本'],
        '電子商品': ['電腦及周邊', '3C產品'],
        '汽機車': ['油錢', '停車費', '保養費用', '洗車費用', '購車費用'],
        '醫療保健': ['診所就醫', '購買藥物', '保健食品', '健檢檢查'],
        '人情交際': ['送禮', '紅包', '白包'],
        '理財投資': ['股票', '頭期貸款', '房屋貸款'],
        '其他': ['捐款', '雜支', '悠遊卡加值']
    };
    const incomeCategories = ['薪水', '差旅費', '利息', '股票', '其他'];
    
    let pieChartInstance = null, barChartInstance = null, lineChartInstance = null;
    function isCreditCard(accName) { return accName.includes('信用卡'); }

    function parseLocalDate(dateStr) {
        if (!dateStr) return new Date();
        const parts = dateStr.split('-');
        if (parts.length !== 3) return new Date(dateStr);
        return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 0, 0, 0);
    }

    const today = new Date(), todayStr = today.toISOString().split('T')[0];
    document.getElementById('recordDate').value = todayStr;
    const currentYear = today.getFullYear(), currentMonthStr = String(today.getMonth() + 1).padStart(2, '0');
    document.getElementById('analysisStartDate').value = `${currentYear}-${currentMonthStr}-01`;
    document.getElementById('analysisEndDate').value = todayStr;
    document.getElementById('filterStartDate').value = `${currentYear}-${currentMonthStr}-01`;
    document.getElementById('filterEndDate').value = todayStr;

    initAccountUI();
    initSelectOptions();
    initBudgetMonthSelect();
    initFilterControls();
    initCustomGroupSubCatsOptions(); 
    handleTypeChange();
    
    fetchCloudData();

    function fetchCloudData() {
        setCloudStatus("正在從 Google 試算表拉取最新雲端數據...", true);
        fetch(CLOUD_API_URL)
        .then(res => res.json())
        .then(resData => {
            if (resData.status === "success" && resData.data) {
                const cloud = resData.data;
                if(Object.keys(cloud.accounts).length > 0) accountBalances = cloud.accounts;
                budgets = cloud.budgets || {};
                customGroupBudgets = cloud.customGroupBudgets || {}; 
                records = cloud.records || [];
                records.sort((a, b) => parseLocalDate(b.date) - parseLocalDate(a.date));
                
                setCloudStatus("☁️ 雲端同步完畢，資料已是最新狀態", false);
                updateUI();
            } else {
                setCloudStatus("❌ 雲端讀取失敗，改用離線緩衝模式", false);
            }
        })
        .catch(err => {
            console.error(err);
            setCloudStatus("⚠️ 無法連線至雲端，請確認 API 網址是否正確", false);
        });
    }

    function pushToCloud() {
        setCloudStatus("🔄 雲端正在背景同步中...", false);
        const payload = {
            action: "syncAll",
            accounts: Object.keys(accountBalances).map(k => [k, accountBalances[k]]),
            budgets: Object.keys(budgets).map(k => [k, budgets[k]]),
            customGroupBudgets: customGroupBudgets, 
            records: records
        };
        fetch(CLOUD_API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(resData => {
            if(resData.status === "success") { setCloudStatus("✨ 雲端資料已同步", false); } 
            else { setCloudStatus("❌ 雲端同步失敗，系統將於下次重試", false); }
        })
        .catch(err => { console.error(err); setCloudStatus("⚠️ 網路暫時中斷，資料已存於本地快取", false); });
    }

    function exportToCSV() {
        let csvContent = "=== 系統帳戶初始設定配額 ===\n帳戶名稱,初始金額\n";
        accountNames.forEach(name => { csvContent += `${name},${accountBalances[name]}\n`; });
        csvContent += "=== 明細流水帳紀錄開始 ===\n交易日期,交易類型,主分類/大項,子分類/小項,交易帳戶/細節,金額,備註說明\n";
        records.forEach(item => {
            let row = [item.date, item.type];
            if (item.type === '轉帳') { row.push("內部轉帳", "-", `從 [${item.fromAccount}] 轉到 [${item.toAccount}]`); } 
            else { row.push(item.mainCategory, item.type === '支出' ? item.subCategory : "-", item.account); }
            row.push(item.amount, item.note.replace(/,/g, " ")); csvContent += row.join(",") + "\n";
        });
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob), link = document.createElement("a");
        link.setAttribute("href", url); link.setAttribute("download", `雲端智慧記帳本_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function triggerCSVImport() { document.getElementById('importCSVFileInput').click(); }
    function importFromCSV(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const text = e.target.result, lines = text.split("\n");
                let importedRecords = [], parsedBalances = JSON.parse(JSON.stringify(accountBalances)), isReadingRecords = false;
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim(); if (!line) continue;
                    if (line.includes("=== 明細流水帳紀錄開始 ===")) { isReadingRecords = true; i++; continue; }
                    if (!isReadingRecords) {
                        let parts = line.split(","); if (parts.length === 2 && accountNames.includes(parts[0].trim())) parsedBalances[parts[0].trim()] = parseInt(parts[1].trim()) || 0;
                    } else {
                        let cols = line.split(","); if (cols.length < 6) continue;
                        let item = { id: Date.now() + i, date: cols[0].trim(), type: cols[1].trim(), amount: parseInt(cols[5].trim()) || 0, note: cols[6]?cols[6].trim():"無備註" };
                        if (item.type === '轉帳') {
                            let match = cols[4].trim().match(/從 \[(.*?)\] 轉到 \[(.*?)\]/); if (match) { item.fromAccount = match[1]; item.toAccount = match[2]; }
                        } else { item.mainCategory = cols[2].trim(); item.subCategory = cols[3].trim() === '-' ? '' : cols[3].trim(); item.account = cols[4].trim(); }
                        importedRecords.push(item);
                    }
                }
                if (confirm(`確認匯入？將會同步覆蓋本機與雲端 Google Sheet 內的所有資料喔！`)) {
                    accountBalances = parsedBalances; records = importedRecords; records.sort((a, b) => parseLocalDate(b.date) - parseLocalDate(a.date)); updateUI(); pushToCloud(); alert('Excel 與雲端完全同步成功！');
                }
            } catch (err) { alert('解析 CSV 失敗：' + err.message); }
        };
        reader.readAsText(file, "UTF-8");
    }

    function updateUI() {
        let currentBalances = JSON.parse(JSON.stringify(accountBalances));
        let totalIncome = 0, totalExpense = 0;
        const selectedBudgetMonth = document.getElementById('budgetMonthSelect').value;
        const [bYear, bMonth] = selectedBudgetMonth.split('-').map(Number);

        let expenseChartMap = {}; Object.keys(expenseData).forEach(c => expenseChartMap[c] = 0);
        let incomeChartMap = {}; incomeCategories.forEach(c => incomeChartMap[c] = 0);
        
        let monthBudgetSpentMap = {}; Object.keys(expenseData).forEach(c => monthBudgetSpentMap[c] = 0);
        let customGroupSpentMap = {}; Object.keys(customGroupBudgets).forEach(g => customGroupSpentMap[g] = 0);

        let chronologicalRecords = [...records].reverse();
        let dailyAssetTimeline = {};
        
        const startFilter = parseLocalDate(document.getElementById('analysisStartDate').value);
        const endFilter = parseLocalDate(document.getElementById('analysisEndDate').value);
        
        const filterTimeMode = document.getElementById('filterTimeMode').value, filterMonthStr = document.getElementById('filterMonthSelect').value;
        const filterStartDay = parseLocalDate(document.getElementById('filterStartDate').value);
        const filterEndDay = parseLocalDate(document.getElementById('filterEndDate').value);
        const filterTargetCategory = document.getElementById('filterCategorySelect').value;

        chronologicalRecords.forEach(item => {
            if (item.type === '轉帳') {
                currentBalances[item.fromAccount] -= item.amount;
                if (isCreditCard(item.toAccount)) { currentBalances[item.toAccount] -= item.amount; } 
                else { currentBalances[item.toAccount] += item.amount; }
            } else {
                if (item.type === '收入') {
                    totalIncome += item.amount; currentBalances[item.account] += item.amount;
                    let iDate = parseLocalDate(item.date);
                    if (iDate >= startFilter && iDate <= endFilter) { if(incomeChartMap[item.mainCategory] !== undefined) incomeChartMap[item.mainCategory] += item.amount; }
                } else {
                    totalExpense += item.amount;
                    if (isCreditCard(item.account)) { currentBalances[item.account] += item.amount; } 
                    else { currentBalances[item.account] -= item.amount; } // ✨ 已修復 Bug：原本誤寫為 -= item.account導致NaN

                    if (item.date) {
                        let recDate = parseLocalDate(item.date);
                        if (!isNaN(recDate.getTime())) {
                            let rYear = recDate.getFullYear(); let rMonth = recDate.getMonth() + 1;
                            if (rYear === bYear && rMonth === bMonth) {
                                if (monthBudgetSpentMap[item.mainCategory] !== undefined) { monthBudgetSpentMap[item.mainCategory] += item.amount; }
                                
                                Object.keys(customGroupBudgets).forEach(groupName => {
                                    const groupSetting = customGroupBudgets[groupName];
                                    if (groupSetting.subCats && groupSetting.subCats.includes(item.subCategory)) {
                                        customGroupSpentMap[groupName] += item.amount;
                                    }
                                });
                            }
                        }
                    }
                    let iDate = parseLocalDate(item.date);
                    if (iDate >= startFilter && iDate <= endFilter) { if(expenseChartMap[item.mainCategory] !== undefined) expenseChartMap[item.mainCategory] += item.amount; }
                }
            }
            let tAssets = 0, tLiabilities = 0;
            accountNames.forEach(name => { if (isCreditCard(name)) tLiabilities += currentBalances[name]; else tAssets += currentBalances[name]; });
            dailyAssetTimeline[item.date] = tAssets - tLiabilities;
        });

        let listHtml = '', matchCount = 0;
        records.forEach(item => {
            let passTime = filterTimeMode === 'month' ? (item.date.substring(0, 7) === filterMonthStr) : (parseLocalDate(item.date) >= filterStartDay && parseLocalDate(item.date) <= filterEndDay);
            let passCategory = filterTargetCategory === 'ALL' ? true : (filterTargetCategory === '內部轉帳' ? item.type === '轉帳' : (item.type !== '轉帳' && item.mainCategory === filterTargetCategory));

            if (passTime && passCategory) {
                matchCount++;
                if (item.type === '轉帳') {
                    listHtml += `<div class="history-item"><div class="item-left transfer-border"><div class="item-date">${item.date}</div><div class="item-title"><span class="item-acc-tag" style="background:#9b59b6; color:white;">轉帳 🔄</span>從 <strong>${item.fromAccount}</strong> ➡️ <strong>${item.toAccount}</strong></div><div class="item-note">${item.note}</div></div><div class="item-right"><div class="item-amount" style="color: #9b59b6;">$${item.amount}</div><button class="btn-delete" onclick="deleteRecord(${item.id})">❌</button></div></div>`;
                } else {
                    const isIncome = item.type === '收入';
                    listHtml += `<div class="history-item"><div class="item-left ${isIncome ? 'income-border' : 'expense-border'}"><div class="item-date">${item.date}</div><div class="item-title"><span class="item-acc-tag">${item.account}</span>${isIncome ? item.mainCategory : item.mainCategory + '<span class="item-sub-tag">' + (item.subCategory || '') + '</span>'}</div><div class="item-note">${item.note}</div></div><div class="item-right"><div class="item-amount" style="color: ${isIncome?'#2ecc71':'#e74c3c'};">${isIncome?'+':'-'}$${item.amount}</div><button class="btn-delete" onclick="deleteRecord(${item.id})">❌</button></div></div>`;
                }
            }
        });
        document.getElementById('recordList').innerHTML = matchCount === 0 ? `<p style="text-align:center; color:#a0aec0; font-size:13px; padding:20px 0;">無符合條件紀錄 ☕</p>` : listHtml;
        document.getElementById('totalIncome').innerText = totalIncome; document.getElementById('totalExpense').innerText = totalExpense;

        let totalAssets = 0, totalLiabilities = 0;
        accountNames.forEach(name => {
            const valSpan = document.getElementById(`val-${name}`), currentVal = currentBalances[name];
            if (isCreditCard(name)) { valSpan.innerText = `欠 $${currentVal}`; valSpan.style.color = currentVal > 0 ? '#e74c3c' : '#718096'; totalLiabilities += currentVal; } 
            else { valSpan.innerText = `$${currentVal}`; valSpan.style.color = currentVal < 0 ? '#e74c3c' : '#2d3748'; totalAssets += currentVal; }
        });
        const netBalance = totalAssets - totalLiabilities, netBalanceDiv = document.getElementById('netBalance');
        netBalanceDiv.innerText = `$${netBalance}`; netBalanceDiv.style.color = (netBalance < 0) ? '#e74c3c' : '#2ecc71';

        const budgetListSection = document.getElementById('budgetListSection'); budgetListSection.innerHTML = '';
        let hasAnyBudget = false;

        for (const cat in budgets) {
            hasAnyBudget = true; const budgetLimit = budgets[cat], currentSpent = monthBudgetSpentMap[cat] || 0, remaining = budgetLimit - currentSpent;
            let percent = budgetLimit > 0 ? (currentSpent / budgetLimit) * 100 : 0; if (percent > 100) percent = 100; const isOver = currentSpent > budgetLimit;
            budgetListSection.insertAdjacentHTML('beforeend', `
                <div class="budget-item">
                    <div class="budget-info">
                        <span>🏷️ <strong>${cat}</strong></span>
                        <div>
                            <span style="color: ${isOver?'#e74c3c':'#2ecc71'}; font-weight: bold; margin-right: 8px;">${isOver ? '超支 $' + Math.abs(remaining) : '剩 $' + remaining}</span>
                            <button class="btn-budget-delete" onclick="deleteBudget('${cat}')">❌</button>
                        </div>
                    </div>
                    <div class="budget-info" style="color: #718096; font-size: 11px;"><span>已花 $${currentSpent} / 預算 $${budgetLimit}</span></div>
                    <div class="progress-bar-bg"><div class="${isOver?'progress-bar-fill progress-over':'progress-bar-fill'}" style="width: ${percent}%;"></div></div>
                </div>`);
        }

        for (const groupName in customGroupBudgets) {
            hasAnyBudget = true;
            const group = customGroupBudgets[groupName];
            const budgetLimit = group.limit;
            const currentSpent = customGroupSpentMap[groupName] || 0;
            const remaining = budgetLimit - currentSpent;
            let percent = budgetLimit > 0 ? (currentSpent / budgetLimit) * 100 : 0; if (percent > 100) percent = 100;
            const isOver = currentSpent > budgetLimit;
            
            budgetListSection.insertAdjacentHTML('beforeend', `
                <div class="budget-item custom-budget-item">
                    <div class="budget-info">
                        <span style="color:#2b6cb0;">🧩 <strong>${groupName}</strong></span>
                        <div>
                            <span style="color: ${isOver?'#e74c3c':'#2ecc71'}; font-weight: bold; margin-right: 8px;">${isOver ? '超支 $' + Math.abs(remaining) : '剩 $' + remaining}</span>
                            <button class="btn-budget-delete" onclick="deleteCustomGroupBudget('${groupName}')">❌</button>
                        </div>
                    </div>
                    <div class="budget-info" style="color: #4a5568; font-size: 11px;">
                        <span>包含: ${group.subCats.join(', ')}</span>
                    </div>
                    <div class="budget-info" style="color: #718096; font-size: 11px;">
                        <span>已花 $${currentSpent} / 預算 $${budgetLimit}</span>
                    </div>
                    <div class="progress-bar-bg"><div class="${isOver?'progress-bar-fill progress-over':'progress-bar-fill'}" style="background-color:#3182ce; width: ${percent}%;"></div></div>
                </div>`);
        }

        if (!hasAnyBudget) budgetListSection.innerHTML = `<p style="color:#a0aec0; text-align:center; font-size:12px;">尚未設定任何預算控管項目 ☕</p>`;

        renderThreeSeparateCharts(startFilter, endFilter, expenseChartMap, incomeChartMap, dailyAssetTimeline);
    }

    function renderThreeSeparateCharts(start, end, expenseDataMap, incomeDataMap, dailyAssetTimeline) {
        const totalExpenseInPeriod = Object.values(expenseDataMap).reduce((a, b) => a + b, 0);
        const expenseLabels = Object.keys(expenseDataMap).filter(k => expenseDataMap[k] > 0).map(k => `${k} ($${expenseDataMap[k].toLocaleString()})`);
        const expenseValues = Object.keys(expenseDataMap).filter(k => expenseDataMap[k] > 0).map(k => expenseDataMap[k]);

        if (pieChartInstance) pieChartInstance.destroy();
        pieChartInstance = new Chart(document.getElementById('expensePieChart').getContext('2d'), {
            type: 'doughnut', 
            data: { labels: expenseLabels, datasets: [{ data: expenseValues, backgroundColor: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#1abc9c','#e67e22','#34495e','#95a5a6','#d35400','#c0392b','#7f8c8d'] }] },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } } 
            },
            plugins: [{
                id: 'centerTextPlugin',
                beforeDraw: function(chart) {
                    const ctx = chart.ctx; ctx.restore();
                    ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "#718096"; ctx.textBaseline = "middle";
                    const text1 = "總支出", textX1 = Math.round((chart.chartArea.left + chart.chartArea.right) / 2 - ctx.measureText(text1).width / 2);
                    const textY1 = Math.round((chart.chartArea.top + chart.chartArea.bottom) / 2 - 12);
                    ctx.fillText(text1, textX1, textY1);
                    
                    ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#e74c3c";
                    const text2 = `$${totalExpenseInPeriod.toLocaleString()}`, textX2 = Math.round((chart.chartArea.left + chart.chartArea.right) / 2 - ctx.measureText(text2).width / 2);
                    const textY2 = Math.round((chart.chartArea.top + chart.chartArea.bottom) / 2 + 12);
                    ctx.fillText(text2, textX2, textY2);
                    ctx.save();
                }
            }]
        });

        const incomeLabels = Object.keys(incomeDataMap).filter(k => incomeDataMap[k] > 0), incomeValues = incomeLabels.map(k => incomeDataMap[k]);
        if (barChartInstance) barChartInstance.destroy();
        barChartInstance = new Chart(document.getElementById('incomeBarChart').getContext('2d'), {
            type: 'bar', data: { labels: incomeLabels, datasets: [{ label: '進帳 ($)', data: incomeValues, backgroundColor: '#2ecc71', borderRadius: 5 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        let timelineMap = {}; let currLoop = new Date(start);
        while (currLoop <= end) { timelineMap[currLoop.toISOString().split('T')[0]] = 0; currLoop.setDate(currLoop.getDate() + 1); }
        Object.keys(timelineMap).forEach(dStr => {
            if (dailyAssetTimeline[dStr] !== undefined) timelineMap[dStr] = dailyAssetTimeline[dStr];
            else { let fallback = 0; Object.keys(dailyAssetTimeline).forEach(t => { if (parseLocalDate(t) <= parseLocalDate(dStr)) fallback = dailyAssetTimeline[t]; }); timelineMap[dStr] = fallback; }
        });
        const lineLabels = Object.keys(timelineMap).sort(), lineValues = lineLabels.map(d => timelineMap[d]);
        if (lineChartInstance) lineChartInstance.destroy();
        lineChartInstance = new Chart(document.getElementById('assetLineChart').getContext('2d'), {
            type: 'line', data: { labels: lineLabels, datasets: [{ label: '資產淨值 ($)', data: lineValues, borderColor: '#3498db', backgroundColor: 'rgba(52,152,219,0.08)', tension: 0.1, fill: true, borderWidth: 3 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }
</script>
</body>
</html>
